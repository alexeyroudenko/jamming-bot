<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamming bot — Tag cloud 3D</title>
  <link rel="stylesheet" href="/flask_static/dashboard_panels.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      font-size: 11px;
      color: #666;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    nav a { color: #555; text-decoration: none; margin-right: 12px; pointer-events: auto; }
    nav a:hover { color: #fff; }
    #status { color: #333; font-size: 10px; }
    #viewport { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #viewport:active { cursor: grabbing; }
    #info {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #333;
      font-size: 12px;
      color: #8f8;
      z-index: 12;
      max-width: 90vw;
      text-align: center;
      display: none;
    }
    #info.visible { display: block; }
    .banner {
      position: fixed;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: #311;
      border: 1px solid #633;
      color: #f88;
      font-size: 11px;
      z-index: 15;
      max-width: 90%;
      text-align: center;
      display: none;
    }
    .banner.visible { display: block; }
  </style>
</head>
<body>

<nav>
  <div>
    {% include "components/bot_primary_header_tag_vis.html" %}
  </div>
  <span id="status"></span>
</nav>

<div id="api-error" class="banner" role="alert"></div>
<div id="webgl-error" class="banner" role="alert"></div>
<div id="info" aria-live="polite"></div>
<canvas id="viewport"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js" crossorigin="anonymous"></script>
<script>
(function () {
  var API_BASE = {{ tags_api_base|tojson }};
  var API = (API_BASE || '') + '/api/tags/get/';
  var DISPLAY_COUNT_MULT = 2;
  var MAX_TAGS = 600;
  var SPHERE_RADIUS = 14;
  var RADIUS_SPREAD = 0.42;
  var POSITION_JITTER = 3.2;
  var IDLE_MS = 10000;
  /** Каждые N мс — фокус на случайный тег из показанных. */
  var RANDOM_FOCUS_INTERVAL_MS = 21000;
  /** Длительность анимации фокуса на тег (×3 к базовым 1600 мс). */
  var FOCUS_DURATION_MS = 4800;
  var FLASH_MS = 520;
  var FOCUS_CAM_OFFSET = 10;
  var FONT_MIN = 7;
  var SCALE_MIN = 0.33;
  var TEXT_SCALE_MULT = 3;
  /** Шрифт «как на /tags/»: уменьшающий мультипликатор размера. */
  var FONT_SIZE_SCALE = 0.7;
  /** Разброс размера подписи по популярности t: было (1+1.5t) / (1+3t) — ужали на 50% (Iteration17). */
  var TAG3D_FONT_T_MUL = 0.75;
  var TAG3D_SCALE_T_MUL = 1.5;
  /** Удвоение разрешения текстуры спрайта без изменения видимого размера. */
  var SPRITE_DPR = 2;
  var IDLE_ROTATE_DELAY_MS = 1400;
  var IDLE_ROTATE_Y_RAD_PER_SEC = 0.025;
  /** Stagger first paint: one sprite each interval, order rare → popular (see loadTags sort). */
  var TAG_REVEAL_MS = 40;
  var tagRevealToken = 0;
  /** Live words from socket (как /pages/words/): очередь и шаг 200ms. */
  var wordQueue = [];
  var wordTimer = null;
  var WORD_GAP_MS = 200;

  function collectWordsFromPayload(data) {
    if (!data) return [];
    var words = [];
    if (Array.isArray(data.words)) {
      words = words.concat(data.words);
    }
    if (typeof data.words_str === 'string') {
      words = words.concat(data.words_str.split(/\s+/));
    }
    if (data.analyzed && Array.isArray(data.analyzed.words)) {
      words = words.concat(data.analyzed.words);
    }
    if (Array.isArray(data.semantic_words)) {
      words = words.concat(data.semantic_words);
    }
    return words
      .map(function (w) { return String(w == null ? '' : w).trim(); })
      .filter(Boolean);
  }

  function findSpriteByWordCI(word) {
    var lw = word.toLowerCase();
    for (var i = 0; i < sprites.length; i++) {
      if (String(sprites[i].userData.name || '').toLowerCase() === lw) {
        return sprites[i];
      }
    }
    return null;
  }

  function recomputeMaxCountFromSprites() {
    var m = 1;
    for (var i = 0; i < sprites.length; i++) {
      var c = Number(sprites[i].userData.count) || 0;
      if (c > m) m = c;
    }
    return m;
  }

  function refreshAllSpritesForMax(maxCount) {
    lastMaxCountForSprites = maxCount;
    for (var i = 0; i < sprites.length; i++) {
      var s = sprites[i];
      refreshSprite(s, s.userData.name, s.userData.count, maxCount);
    }
  }

  function applyWordToCloud(w) {
    if (!tagsSceneInitialized || !w) return;
    var sp = findSpriteByWordCI(w);
    var prevMax = lastMaxCountForSprites > 0 ? lastMaxCountForSprites : recomputeMaxCountFromSprites();
    if (sp) {
      var prevCnt = Number(sp.userData.count) || 0;
      sp.userData.count = prevCnt + DISPLAY_COUNT_MULT;
      console.log('[tags/3d] bump word:', w, '→', sp.userData.name, 'count', prevCnt, '→', sp.userData.count);
      var newMax = Math.max(prevMax, sp.userData.count);
      flashSpriteRed(sp);
      if (newMax > prevMax) {
        refreshAllSpritesForMax(newMax);
      } else {
        refreshSprite(sp, sp.userData.name, sp.userData.count, newMax);
        lastMaxCountForSprites = newMax;
      }
      setLastTagFromList([sp.userData.name]);
      return;
    }
    if (sprites.length >= MAX_TAGS) {
      console.warn('[tags/3d] skip word (MAX_TAGS):', w);
      return;
    }
    console.log('[tags/3d] add word to cloud:', w);
    var nm = w;
    var cnt = DISPLAY_COUNT_MULT;
    var newMax = Math.max(prevMax, cnt);
    var newsp = makeSprite(nm, cnt, newMax);
    newsp.userData.socketAdded = true;
    newsp.position.copy(chaoticPosition(sprites.length, Math.max(8, sprites.length + 1), SPHERE_RADIUS));
    newsp.visible = true;
    scene.add(newsp);
    sprites.push(newsp);
    spriteByName[nm] = newsp;
    if (newMax > prevMax) {
      refreshAllSpritesForMax(newMax);
    } else {
      lastMaxCountForSprites = newMax;
    }
    flashSpriteRed(newsp);
    setLastTagFromList([nm]);
  }

  function pumpWordQueue() {
    wordTimer = null;
    if (!wordQueue.length) return;
    if (!tagsSceneInitialized) {
      wordTimer = setTimeout(pumpWordQueue, 120);
      return;
    }
    var w = wordQueue.shift();
    applyWordToCloud(w);
    if (wordQueue.length) {
      wordTimer = setTimeout(pumpWordQueue, WORD_GAP_MS);
    }
  }

  function enqueueWordsFromData(data) {
    var arr = collectWordsFromPayload(data);
    for (var i = 0; i < arr.length; i++) {
      console.log('[tags/3d] queue word:', arr[i]);
      wordQueue.push(arr[i]);
    }
    if (!wordTimer && wordQueue.length) {
      pumpWordQueue();
    }
  }

  function maybeResumeWordPump() {
    if (wordTimer || !wordQueue.length || !tagsSceneInitialized) return;
    pumpWordQueue();
  }

  var statusEl = document.getElementById('status');
  var apiErr = document.getElementById('api-error');
  var webglErr = document.getElementById('webgl-error');
  var infoEl = document.getElementById('info');
  var canvas = document.getElementById('viewport');

  var lastActivity = performance.now();
  var lastFocusTagName = '';
  var spriteByName = {};
  var focusAnimating = false;
  var lastOrbitTick = performance.now();

  function bumpActivity() {
    lastActivity = performance.now();
  }

  function showApiError(msg) {
    apiErr.textContent = msg;
    apiErr.classList.add('visible');
    statusEl.textContent = 'API error';
  }

  function showWebGLError(msg) {
    webglErr.textContent = msg;
    webglErr.classList.add('visible');
    statusEl.textContent = 'WebGL unavailable';
  }

  function fibonacciUnit(i, n) {
    var y = 1 - (i / Math.max(1, n - 1)) * 2;
    y = Math.max(-1, Math.min(1, y));
    var r = Math.sqrt(1 - y * y);
    var theta = Math.PI * (3 - Math.sqrt(5)) * i;
    return new THREE.Vector3(
      Math.cos(theta) * r,
      y,
      Math.sin(theta) * r
    );
  }

  function chaoticPosition(i, n, baseRadius) {
    var dir = fibonacciUnit(i, n);
    var jitterR = 1 + (Math.random() - 0.5) * 2 * RADIUS_SPREAD;
    var r = baseRadius * jitterR;
    var p = dir.multiplyScalar(r);
    p.x += (Math.random() - 0.5) * 2 * POSITION_JITTER;
    p.y += (Math.random() - 0.5) * 2 * POSITION_JITTER;
    p.z += (Math.random() - 0.5) * 2 * POSITION_JITTER;
    return p;
  }

  function buildSpriteCanvas(name, fontPx, brightRgb) {
    var pad = 10;
    var probe = document.createElement('canvas').getContext('2d');
    probe.font = 'bold ' + fontPx + 'px monospace';
    var w = Math.ceil(probe.measureText(name).width) + pad * 2;
    var h = fontPx + pad * 2;
    var canvas2d = document.createElement('canvas');
    canvas2d.width = w * SPRITE_DPR;
    canvas2d.height = h * SPRITE_DPR;
    var ctx = canvas2d.getContext('2d');
    ctx.scale(SPRITE_DPR, SPRITE_DPR);
    ctx.font = 'bold ' + fontPx + 'px monospace';
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 1;
    ctx.fillStyle = brightRgb;
    ctx.fillText(name, pad, fontPx + pad / 2);
    return { canvas: canvas2d, w: w, h: h };
  }

  function makeSprite(name, count, maxCount) {
    var t = maxCount > 0 ? Math.min(1, Math.max(0, count / maxCount)) : 0;
    var fontPx = Math.round(FONT_MIN * TEXT_SCALE_MULT * FONT_SIZE_SCALE * (1 + TAG3D_FONT_T_MUL * t));
    var bright = Math.round(80 + t * 175);
    var rgb = 'rgb(' + bright + ',' + bright + ',' + bright + ')';
    var built = buildSpriteCanvas(name, fontPx, rgb);
    var tex = new THREE.CanvasTexture(built.canvas);
    tex.needsUpdate = true;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true, color: 0xffffff });
    var sprite = new THREE.Sprite(mat);
    var scale = SCALE_MIN * TEXT_SCALE_MULT * FONT_SIZE_SCALE * (1 + TAG3D_SCALE_T_MUL * t);
    sprite.scale.set(scale * built.w / built.h, scale, 1);
    sprite.userData = { name: name, count: count, baseScaleX: scale * built.w / built.h, baseScaleY: scale };
    return sprite;
  }

  function refreshSprite(sprite, name, count, maxCount) {
    if (sprite.material && sprite.material.map) {
      sprite.material.map.dispose();
    }
    var t = maxCount > 0 ? Math.min(1, Math.max(0, count / maxCount)) : 0;
    var fontPx = Math.round(FONT_MIN * TEXT_SCALE_MULT * FONT_SIZE_SCALE * (1 + TAG3D_FONT_T_MUL * t));
    var bright = Math.round(80 + t * 175);
    var rgb = 'rgb(' + bright + ',' + bright + ',' + bright + ')';
    var built = buildSpriteCanvas(name, fontPx, rgb);
    var tex = new THREE.CanvasTexture(built.canvas);
    tex.needsUpdate = true;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    sprite.material.map = tex;
    sprite.material.needsUpdate = true;
    var scale = SCALE_MIN * TEXT_SCALE_MULT * FONT_SIZE_SCALE * (1 + TAG3D_SCALE_T_MUL * t);
    sprite.scale.set(scale * built.w / built.h, scale, 1);
    sprite.userData.name = name;
    sprite.userData.count = count;
    sprite.userData.baseScaleX = scale * built.w / built.h;
    sprite.userData.baseScaleY = scale;
  }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  } catch (e) {
    showWebGLError('WebGL failed to initialize. Try another browser or GPU drivers.');
    return;
  }
  if (!renderer.getContext()) {
    showWebGLError('WebGL is not available in this browser.');
    return;
  }

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 0, 32);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 8;
  controls.maxDistance = 80;

  controls.addEventListener('change', bumpActivity);
  controls.addEventListener('end', bumpActivity);

  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var sprites = [];
  var tagsSceneInitialized = false;
  var lastMaxCountForSprites = -1;
  var _depthPos = new THREE.Vector3();
  var _depthFar = new THREE.Color(0x383838);
  var _depthNear = new THREE.Color(0xffffff);

  function updateSpriteDepthColors() {
    var n = sprites.length;
    if (n === 0) return;
    var minD = Infinity;
    var maxD = -Infinity;
    var i, s, d;
    for (i = 0; i < n; i++) {
      s = sprites[i];
      s.getWorldPosition(_depthPos);
      d = camera.position.distanceTo(_depthPos);
      if (d < minD) minD = d;
      if (d > maxD) maxD = d;
    }
    var span = maxD - minD;
    for (i = 0; i < n; i++) {
      s = sprites[i];
      if (s.userData.skipDepthUntil && performance.now() < s.userData.skipDepthUntil) continue;
      s.getWorldPosition(_depthPos);
      d = camera.position.distanceTo(_depthPos);
      var u = span > 1e-5 ? (maxD - d) / span : 1;
      u = Math.pow(Math.min(1, Math.max(0, u)), 1.35);
      s.material.color.copy(_depthFar).lerp(_depthNear, u);
    }
  }

  function onResize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }
  onResize();
  window.addEventListener('resize', onResize);

  function setInfo(text) {
    if (text) {
      infoEl.textContent = text;
      infoEl.classList.add('visible');
    } else {
      infoEl.classList.remove('visible');
    }
  }

  function onPointerMove(ev) {
    bumpActivity();
    var rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(sprites, false);
    if (hits.length > 0) {
      var u = hits[0].object.userData;
      setInfo(u.name + ' · count ' + u.count);
    } else {
      setInfo('');
    }
  }

  function onClick(ev) {
    bumpActivity();
    var rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(sprites, false);
    if (hits.length > 0) {
      var u = hits[0].object.userData;
      setInfo(u.name + ' · count ' + u.count);
    }
  }

  renderer.domElement.addEventListener('pointerdown', bumpActivity);
  renderer.domElement.addEventListener('wheel', bumpActivity, { passive: true });
  renderer.domElement.addEventListener('mousemove', onPointerMove);
  renderer.domElement.addEventListener('click', onClick);
  renderer.domElement.addEventListener('touchstart', bumpActivity, { passive: true });
  renderer.domElement.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    onPointerMove({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: true });

  function easeInOutQuad(x) {
    return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  }

  function flashSpriteRed(sprite) {
    var mat = sprite.material;
    var white = new THREE.Color(0xffffff);
    var red = new THREE.Color(0xff3030);
    var sx0 = sprite.userData.baseScaleX;
    var sy0 = sprite.userData.baseScaleY;
    sprite.userData.skipDepthUntil = performance.now() + FLASH_MS + 80;
    var start = performance.now();
    function step() {
      var u = (performance.now() - start) / FLASH_MS;
      if (u >= 1) {
        mat.color.copy(white);
        sprite.scale.set(sx0, sy0, 1);
        sprite.userData.skipDepthUntil = 0;
        return;
      }
      var wave = u < 0.5 ? u * 2 : (1 - u) * 2;
      mat.color.copy(white).lerp(red, wave);
      var bump = 1 + 0.12 * wave;
      sprite.scale.set(sx0 * bump, sy0 * bump, 1);
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function runFocusOnSprite(sprite) {
    if (focusAnimating || !sprite) return;
    focusAnimating = true;
    controls.enabled = false;
    flashSpriteRed(sprite);

    sprite.updateMatrixWorld(true);
    var p = new THREE.Vector3();
    sprite.getWorldPosition(p);
    var dir = p.clone().normalize();
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
    var endTarget = p.clone();
    var dist = Math.max(controls.minDistance, Math.min(controls.maxDistance * 0.35, p.length() + FOCUS_CAM_OFFSET));
    var endCam = dir.clone().multiplyScalar(dist);

    var startTarget = controls.target.clone();
    var startCam = camera.position.clone();
    var animStart = performance.now();

    function animStep() {
      var raw = (performance.now() - animStart) / FOCUS_DURATION_MS;
      var k = easeInOutQuad(Math.min(1, raw));
      controls.target.lerpVectors(startTarget, endTarget, k);
      camera.position.lerpVectors(startCam, endCam, k);
      camera.lookAt(controls.target);
      if (raw < 1) {
        requestAnimationFrame(animStep);
      } else {
        controls.target.copy(endTarget);
        camera.position.copy(endCam);
        camera.lookAt(controls.target);
        controls.enabled = true;
        controls.update();
        focusAnimating = false;
        lastActivity = performance.now();
        setInfo(sprite.userData.name + ' · count ' + sprite.userData.count);
      }
    }
    requestAnimationFrame(animStep);
  }

  function tryIdleFocus() {
    if (focusAnimating || !lastFocusTagName) return;
    var sp = spriteByName[lastFocusTagName];
    if (sp) {
      runFocusOnSprite(sp);
    } else {
      lastActivity = performance.now();
    }
  }

  function tryRandomTagFocus() {
    if (focusAnimating || !sprites.length) return;
    var visible = [];
    for (var v = 0; v < sprites.length; v++) {
      if (sprites[v].visible) visible.push(sprites[v]);
    }
    if (!visible.length) return;
    var i = Math.floor(Math.random() * visible.length);
    runFocusOnSprite(visible[i]);
  }

  function setLastTagFromList(arr) {
    if (!arr || !arr.length) return;
    var last = arr[arr.length - 1];
    if (typeof last === 'string' && last.length) {
      lastFocusTagName = last;
    }
  }

  function disposeTagSprite(sp) {
    scene.remove(sp);
    if (sp.material && sp.material.map) {
      sp.material.map.dispose();
    }
    if (sp.material) {
      sp.material.dispose();
    }
  }

  function clearAllTagSprites() {
    tagRevealToken++;
    wordQueue = [];
    if (wordTimer) {
      clearTimeout(wordTimer);
      wordTimer = null;
    }
    for (var i = 0; i < sprites.length; i++) {
      disposeTagSprite(sprites[i]);
    }
    sprites = [];
    spriteByName = {};
    tagsSceneInitialized = false;
    lastMaxCountForSprites = -1;
  }

  function revealSpritesStaggered(arr) {
    tagRevealToken++;
    var myTok = tagRevealToken;
    var ix = 0;
    function step() {
      if (myTok !== tagRevealToken) return;
      if (ix >= arr.length) return;
      arr[ix].visible = true;
      ix++;
      if (ix < arr.length) {
        setTimeout(step, TAG_REVEAL_MS);
      }
    }
    step();
  }

  function loadTags(data) {
    if (!Array.isArray(data)) {
      showApiError('Unexpected API response (not a list).');
      clearAllTagSprites();
      return;
    }
    if (data.length === 0) {
      clearAllTagSprites();
      statusEl.textContent = 'no tags';
      return;
    }

    var tags = data.map(function (row) {
      var raw = Number(row.count) || 0;
      return { name: String(row.name || ''), count: raw * DISPLAY_COUNT_MULT };
    }).filter(function (t) { return t.name.length > 0; });

    tags.sort(function (a, b) { return b.count - a.count; });
    tags = tags.slice(0, MAX_TAGS);

    if (tags.length === 0) {
      clearAllTagSprites();
      statusEl.textContent = 'no valid tag names';
      return;
    }

    var maxCount = 1;
    for (var i = 0; i < tags.length; i++) {
      if (tags[i].count > maxCount) maxCount = tags[i].count;
    }

    if (!tagsSceneInitialized) {
      tagsSceneInitialized = true;
      lastMaxCountForSprites = maxCount;
      var revealOrder = tags.slice().sort(function (a, b) { return a.count - b.count; });
      for (var j0 = 0; j0 < revealOrder.length; j0++) {
        var sp0 = makeSprite(revealOrder[j0].name, revealOrder[j0].count, maxCount);
        sp0.visible = false;
        sp0.position.copy(chaoticPosition(j0, revealOrder.length, SPHERE_RADIUS));
        scene.add(sp0);
        sprites.push(sp0);
        spriteByName[revealOrder[j0].name] = sp0;
      }
      revealSpritesStaggered(sprites);
      statusEl.textContent = tags.length + ' tags (max ' + MAX_TAGS + ')';
      maybeResumeWordPump();
      return;
    }

    var have = {};
    var newSprites = [];
    var newByName = {};
    var maxChanged = maxCount !== lastMaxCountForSprites;
    lastMaxCountForSprites = maxCount;

    for (var j = 0; j < tags.length; j++) {
      var nm = tags[j].name;
      var cnt = tags[j].count;
      have[nm] = true;
      var sp = spriteByName[nm];
      if (sp) {
        var countChanged = sp.userData.count !== cnt;
        if (countChanged) {
          flashSpriteRed(sp);
        }
        if (countChanged || maxChanged) {
          refreshSprite(sp, nm, cnt, maxCount);
        }
        newByName[nm] = sp;
        newSprites.push(sp);
      } else {
        sp = makeSprite(nm, cnt, maxCount);
        sp.position.copy(chaoticPosition(j, tags.length, SPHERE_RADIUS));
        scene.add(sp);
        newByName[nm] = sp;
        newSprites.push(sp);
      }
    }

    for (var k = 0; k < sprites.length; k++) {
      var old = sprites[k];
      if (!have[old.userData.name]) {
        disposeTagSprite(old);
      }
    }

    sprites = newSprites;
    spriteByName = newByName;
    statusEl.textContent = tags.length + ' tags (max ' + MAX_TAGS + ')';
    maybeResumeWordPump();
  }

  function fetchTags() {
    return fetch(API)
      .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
      .then(function (res) {
        var body = res.body;
        if (!res.ok || (body && body.error)) {
          var detail = (body && body.detail) ? String(body.detail) : '';
          var errMsg = (body && body.error) ? String(body.error) : 'request failed';
          showApiError('Tags API error: ' + errMsg + (detail ? ' — ' + detail : ''));
          return;
        }
        if (!Array.isArray(body)) {
          showApiError('Tags API returned non-array JSON.');
          return;
        }
        apiErr.classList.remove('visible');
        loadTags(body);
      })
      .catch(function (err) {
        console.error(err);
        showApiError('Network error loading tags: ' + (err && err.message ? err.message : String(err)));
      });
  }

  function tick() {
    requestAnimationFrame(tick);
    var now = performance.now();
    var dt = Math.min(0.05, (now - lastOrbitTick) / 1000);
    lastOrbitTick = now;
    if (!focusAnimating && now - lastActivity >= IDLE_ROTATE_DELAY_MS) {
      scene.rotation.y += IDLE_ROTATE_Y_RAD_PER_SEC * dt;
    }
    if (!focusAnimating && lastFocusTagName && now - lastActivity >= IDLE_MS) {
      tryIdleFocus();
    }
    controls.update();
    updateSpriteDepthColors();
    renderer.render(scene, camera);
  }

  tick();
  setInterval(tryRandomTagFocus, RANDOM_FOCUS_INTERVAL_MS);

  var socket = io({ path: '/socket.io', transports: ['websocket', 'polling'] });
  socket.on('analyzed', function (data) {
    if (data && data.tags && data.tags.length) {
      setLastTagFromList(data.tags);
    }
    enqueueWordsFromData(data);
  });
  socket.on('tags_updated', function (data) {
    if (data && data.semantic_words && data.semantic_words.length) {
      setLastTagFromList(data.semantic_words);
    } else if (data && data.tags && data.tags.length) {
      setLastTagFromList(data.tags);
    }
    enqueueWordsFromData(data);
  });
  socket.on('step', function (data) {
    if (data && data.analyzed) {
      enqueueWordsFromData(data);
    }
  });

  statusEl.textContent = 'loading…';
  fetchTags();
})();
</script>
</body>
</html>
