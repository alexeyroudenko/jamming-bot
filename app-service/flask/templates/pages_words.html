{% extends "base_dashboard.html" %}
{% block title %}Jamming bot — words{% endblock %}
{% block body_class %}jb-pages-words{% endblock %}
{% block head_extra %}
<style>
  @keyframes jb-pages-words-reveal-lr {
    from {
      clip-path: inset(0 100% 0 0);
    }
    to {
      clip-path: inset(0 0 0 0);
    }
  }
  body.jb-pages-words {
    overflow-x: hidden;
  }
  body.jb-pages-words .jb-pages-words-main {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    background: transparent;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: calc(100dvh - 140px);
    display: flex;
    flex-direction: column;
  }
  body.jb-pages-words .jb-pages-words-list {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    line-height: 1.35;
    word-break: break-word;
    font-size: 24pt;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body.jb-pages-words .jb-pages-words-word {
    position: absolute;
    opacity: 1;
    clip-path: inset(0 100% 0 0);
    color: #fff;
    display: inline-flex;
    align-items: center;
    padding: 0.25em 0.55em;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.42);
    box-decoration-break: clone;
    max-width: min(90vw, 480px);
  }
  body.jb-pages-words .jb-pages-words-word.is-visible {
    animation: jb-pages-words-reveal-lr 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  body.jb-pages-words .jb-pages-words-empty {
    color: #9a9a9a;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
{% endblock %}
{% block content %}
<main class="jb-pages-words-main" aria-label="Semantic words">
  <div id="words-list" class="jb-pages-words-list">
    <span class="jb-pages-words-empty">Waiting for semantic analysis…</span>
  </div>
</main>
{% endblock %}
{% block extra_scripts %}
<script>
function showLoginForm() { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); }
function handleLogout() { window.location.href = '/logout'; }
document.body.classList.remove('is-admin');
(function () {
  var s = window.socket;
  if (!s) return;
  var list = document.getElementById('words-list');
  var MAX_WORDS = 600;
  var seen = new Set();
  var wordQueue = [];
  var wordTimer = null;
  var WORD_GAP_MS = 200;

  function placeWordRandom(el) {
    var cw = list.clientWidth;
    var ch = list.clientHeight;
    if (cw < 8 || ch < 8) return;
    var w = el.offsetWidth;
    var h = el.offsetHeight;
    var maxL = Math.max(0, cw - w);
    var maxT = Math.max(0, ch - h);
    el.style.left = Math.floor(Math.random() * (maxL + 1)) + 'px';
    el.style.top = Math.floor(Math.random() * (maxT + 1)) + 'px';
  }

  function appendWordToDom(w) {
    if (list.querySelector('.jb-pages-words-empty')) {
      list.innerHTML = '';
    }
    var el = document.createElement('span');
    el.className = 'jb-pages-words-word';
    el.textContent = w;
    /* 0.5×…2× от базового кегля списка (1em = размер .jb-pages-words-list) */
    el.style.fontSize = (0.5 + Math.random() * 1.5) + 'em';
    list.appendChild(el);
    requestAnimationFrame(function () {
      placeWordRandom(el);
      el.classList.add('is-visible');
    });
    while (list.childNodes.length > MAX_WORDS) {
      var first = list.firstChild;
      if (first && first.textContent) {
        seen.delete(first.textContent.toLocaleLowerCase());
      }
      list.removeChild(first);
    }
  }

  function pumpWords() {
    wordTimer = null;
    if (!wordQueue.length) return;
    var w = wordQueue.shift();
    appendWordToDom(w);
    if (wordQueue.length) {
      wordTimer = setTimeout(pumpWords, WORD_GAP_MS);
    }
  }

  /** Токены из текста шага (как на /pages/texts/), если semantic-service ещё не дал words или do_analyze выкл. */
  function wordsFromPlainText(str) {
    if (typeof str !== 'string') return [];
    var s = str.trim();
    if (!s) return [];
    var out = [];
    var re;
    try {
      re = new RegExp('[\\p{L}\\p{N}][\\p{L}\\p{N}\'\\u2019-]*', 'gu');
    } catch (e) {
      re = /[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F'\-]*/g;
    }
    var m;
    var cap = 400;
    while ((m = re.exec(s)) !== null && out.length < cap) {
      if (m[0].length >= 2) out.push(m[0]);
    }
    return out;
  }

  function enqueueWords(words) {
    if (!Array.isArray(words)) return;
    var added = false;
    words.forEach(function (raw) {
      var w = String(raw == null ? '' : raw).trim();
      if (!w) return;
      var key = w.toLocaleLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      wordQueue.push(w);
      added = true;
    });
    if (added && !wordTimer) {
      pumpWords();
    }
  }

  function ingest(data) {
    if (!data) return;
    var words = [];
    if (Array.isArray(data.words)) {
      words = words.concat(data.words);
    }
    if (Array.isArray(data.tags)) {
      words = words.concat(data.tags);
    }
    if (typeof data.words_str === 'string') {
      words = words.concat(data.words_str.split(/\s+/));
    }
    if (data.analyzed && Array.isArray(data.analyzed.words)) {
      words = words.concat(data.analyzed.words);
    }
    enqueueWords(words);
  }

  s.on('analyzed', ingest);
  s.on('step', function (data) {
    if (!data) return;
    if (data.analyzed) ingest(data);
    if (typeof data.text === 'string' && data.text.trim().length) {
      ingest({ words: wordsFromPlainText(data.text) });
    }
  });
})();
</script>
{% endblock %}
