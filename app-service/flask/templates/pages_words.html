{% extends "base_dashboard.html" %}
{% block title %}Jamming bot — words{% endblock %}
{% block body_class %}jb-pages-words{% endblock %}
{% block head_extra %}
<style>
  body.jb-pages-words {
    overflow-x: hidden;
  }
  body.jb-pages-words .jb-pages-words-main {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    background: transparent;
    color: #fff;
    font-family: "Lucida Grande", "Droid Sans", Arial, Helvetica, sans-serif;
    min-height: calc(100dvh - 140px);
    display: flex;
    flex-direction: column;
  }
  body.jb-pages-words .jb-pages-words-list {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35em 0.5em;
    align-content: flex-start;
    line-height: 1.35;
    word-break: break-word;
  }
  body.jb-pages-words .jb-pages-words-word {
    opacity: 0;
    transition: opacity 240ms ease-in;
    color: #fff;
    display: inline-flex;
    align-items: center;
    padding: 0.25em 0.55em;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.42);
    box-decoration-break: clone;
  }
  body.jb-pages-words .jb-pages-words-word.is-visible {
    opacity: 1;
  }
  body.jb-pages-words .jb-pages-words-empty {
    color: #9a9a9a;
    font-size: 14px;
  }
</style>
{% endblock %}
{% block content %}
<main class="jb-pages-words-main" aria-label="Semantic words">
  <div id="words-list" class="jb-pages-words-list">
    <span class="jb-pages-words-empty">Waiting for semantic analysis…</span>
  </div>
</main>
{% endblock %}
{% block extra_scripts %}
<script src="/flask_static/pages_view_fit.js"></script>
<script>
function showLoginForm() { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); }
function handleLogout() { window.location.href = '/logout'; }
document.body.classList.remove('is-admin');
(function () {
  var s = window.socket;
  if (!s) return;
  var list = document.getElementById('words-list');
  var MAX_WORDS = 600;
  var seen = new Set();

  function appendWord(raw) {
    var w = String(raw == null ? '' : raw).trim();
    if (!w) return;
    if (list.querySelector('.jb-pages-words-empty')) {
      list.innerHTML = '';
    }
    var key = w.toLocaleLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    var el = document.createElement('span');
    el.className = 'jb-pages-words-word';
    el.textContent = w;
    list.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('is-visible'); });
    while (list.childNodes.length > MAX_WORDS) {
      var first = list.firstChild;
      if (first && first.textContent) {
        seen.delete(first.textContent.toLocaleLowerCase());
      }
      list.removeChild(first);
    }
  }

  function scheduleListFit() {
    if (!window.jbPageViewFit || !list) return;
    if (!list.querySelector('.jb-pages-words-word')) {
      list.style.fontSize = '';
      return;
    }
    window.jbPageViewFit.debounce(list, { minPx: 10, maxPx: 140 }, 70);
  }

  function ingest(data) {
    if (!data) return;
    var words = [];
    if (Array.isArray(data.words)) {
      words = data.words.slice();
    } else if (typeof data.words_str === 'string') {
      words = data.words_str.split(/\s+/);
    }
    if (data.analyzed && Array.isArray(data.analyzed.words)) {
      words = words.concat(data.analyzed.words);
    }
    words.forEach(appendWord);
    scheduleListFit();
  }

  s.on('analyzed', ingest);
  s.on('step', function (data) {
    if (data && data.analyzed) ingest(data);
  });

  window.addEventListener('resize', function () { scheduleListFit(); });
})();
</script>
{% endblock %}
