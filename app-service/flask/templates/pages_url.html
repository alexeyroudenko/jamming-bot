{% extends "base_dashboard.html" %}
{% block title %}Jamming bot — url{% endblock %}
{% block body_class %}jb-pages-url{% endblock %}
{% block head_extra %}
<style>
  body.jb-pages-url {
    overflow-x: hidden;
  }
  body.jb-pages-url .jb-pages-url-main {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    background: transparent;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: calc(100dvh - 140px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.jb-pages-url #url {
    font-size: clamp(16px, 4vw, 32px);
    line-height: 1.35;
    word-break: break-word;
    overflow-wrap: anywhere;
    text-align: center;
    color: #fff;
  }
  body.jb-pages-url #url a {
    color: inherit;
    text-decoration: none;
  }
  body.jb-pages-url #url code {
    font-family: inherit;
    font-size: inherit;
  }
  body.jb-pages-url #url.is-waiting {
    color: #9a9a9a;
    font-size: 14px;
  }
</style>
{% endblock %}
{% block content %}
<main class="jb-pages-url-main" aria-label="Current step URL">
  <div id="url" class="is-waiting">Waiting for step…</div>
</main>
{% endblock %}
{% block extra_scripts %}
<script>
function showLoginForm() { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); }
function handleLogout() { window.location.href = '/logout'; }
document.body.classList.remove('is-admin');
(function () {
  var el = document.getElementById('url');
  if (!el) return;

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function setStepUrl(data) {
    var url = data && typeof data.url === 'string' ? data.url.trim() : '';
    if (!url) {
      el.classList.add('is-waiting');
      el.textContent = 'Waiting for step…';
      return;
    }
    var step = data && data.step != null ? data.step : null;
    el.classList.remove('is-waiting');
    if (step != null) {
      el.innerHTML = '<a href="' + escapeHtml(url) + '" target="_blank" rel="noreferrer noopener"><code><nobr>' +
        escapeHtml(String(step)) + ' : ' + escapeHtml(url) + '</nobr></code></a>';
    } else {
      el.innerHTML = '<a href="' + escapeHtml(url) + '" target="_blank" rel="noreferrer noopener">' + escapeHtml(url) + '</a>';
    }
  }

  var s = window.socket;
  if (!s) return;
  s.on('step', function (data) { setStepUrl(data); });
  s.on('sublink', function (data) { setStepUrl(data); });
  s.on('clear', function () { setStepUrl(null); });
})();
</script>
{% endblock %}
