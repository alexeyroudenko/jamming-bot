{% extends "base_dashboard.html" %}
{% block title %}Jamming bot — url{% endblock %}
{% block body_class %}jb-pages-url{% endblock %}
{% block head_extra %}
<style>
  body.jb-pages-url .jb-pages-url-main {
    margin: 0;
    padding: 24px 24px 200px;
    background: transparent;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.jb-pages-url #url {
    font-size: clamp(16px, 4vw, 32px);
    line-height: 1.35;
    word-break: break-word;
    overflow-wrap: anywhere;
    text-align: center;
    color: #fff;
  }
</style>
{% endblock %}
{% block content %}
<main class="jb-pages-url-main" aria-label="Current URL">
  <div id="url"></div>
</main>
{% endblock %}
{% block extra_scripts %}
<script>
function showLoginForm() { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); }
function handleLogout() { window.location.href = '/logout'; }
document.body.classList.remove('is-admin');
(function () {
  var el = document.getElementById('url');
  if (el) el.textContent = window.location.href;
  var s = window.socket;
  if (!s) return;
  s.on('connect', function () { console.log('socket connect'); });
  s.on('disconnect', function () { console.log('socket disconnect'); });
})();
</script>
{% endblock %}
