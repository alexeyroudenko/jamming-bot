{% extends "base_dashboard.html" %}
{% block title %}Jamming bot — empty{% endblock %}
{% block body_class %}jb-pages-empty{% endblock %}
{% block head_extra %}
<style>
  body.jb-pages-empty .jb-pages-empty-main {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
{% endblock %}
{% block content %}
<main class="jb-pages-empty-main" aria-label="Empty page"></main>
{% endblock %}
{% block extra_scripts %}
<script>
function showLoginForm() { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); }
function handleLogout() { window.location.href = '/logout'; }
document.body.classList.remove('is-admin');
(function () {
  var s = window.socket;
  if (!s) return;
  s.on('connect', function () { console.log('socket connect'); });
  s.on('disconnect', function () { console.log('socket disconnect'); });
  s.on('tags_updated', function (data) { console.log('tags_updated', data); });
  s.on('step', function (data) { console.log('step', data); });
  s.on('screenshot', function (data) { console.log('screenshot', data); });
  s.on('location', function (data) { console.log('location', data); });
  s.on('analyzed', function (data) { console.log('analyzed', data); });
})();
</script>
{% endblock %}
