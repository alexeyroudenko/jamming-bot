<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamming bot — empty</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>
</head>
<body>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
<script>
(function () {
  var socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', function () { console.log('socket connect'); });
  socket.on('disconnect', function () { console.log('socket disconnect'); });
  socket.on('tags_updated', function (data) { console.log('tags_updated', data); });
  socket.on('step', function (data) { console.log('step', data); });
  socket.on('screenshot', function (data) { console.log('screenshot', data); });
  socket.on('location', function (data) { console.log('location', data); });
  socket.on('analyzed', function (data) { console.log('analyzed', data); });
})();
</script>
</body>
</html>
