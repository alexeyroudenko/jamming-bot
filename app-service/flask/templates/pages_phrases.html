{% extends "base_dashboard.html" %}
{% block title %}Jamming bot — phrases{% endblock %}
{% block body_class %}jb-pages-phrases{% endblock %}
{% block head_extra %}
<style>
  @keyframes jb-pages-phrases-reveal-lr {
    from {
      clip-path: inset(0 100% 0 0);
    }
    to {
      clip-path: inset(0 0 0 0);
    }
  }
  body.jb-pages-phrases {
    overflow-x: hidden;
  }
  body.jb-pages-phrases .jb-pages-phrases-main {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    background: transparent;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: calc(100dvh - 140px);
    display: flex;
    flex-direction: column;
  }
  body.jb-pages-phrases .jb-pages-phrases-list {
    position: relative;
    flex: 1;
    min-height: 280px;
    overflow: hidden;
    font-size: clamp(14px, 2.4vw, 26px);
    line-height: 1.3;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body.jb-pages-phrases .jb-pages-phrases-item:not(.jb-pages-phrases-empty) {
    position: absolute;
    opacity: 1;
    clip-path: inset(0 100% 0 0);
    color: #fff;
    background: #ff0000;
    padding: 2px 8px;
    border-radius: 3px;
    max-width: min(92vw, 520px);
    word-break: break-word;
    display: inline-flex;
    align-items: center;
  }
  body.jb-pages-phrases .jb-pages-phrases-item:not(.jb-pages-phrases-empty).is-visible {
    animation: jb-pages-phrases-reveal-lr 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  body.jb-pages-phrases .jb-pages-phrases-empty {
    color: #9a9a9a;
    font-size: 14px;
    background: transparent;
  }
</style>
{% endblock %}
{% block content %}
<main class="jb-pages-phrases-main" aria-label="Semantic phrases">
  <div id="phrases-list" class="jb-pages-phrases-list">
    <span class="jb-pages-phrases-item jb-pages-phrases-empty is-visible">Waiting for noun phrases…</span>
  </div>
</main>
{% endblock %}
{% block extra_scripts %}
<script>
function showLoginForm() { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); }
function handleLogout() { window.location.href = '/logout'; }
document.body.classList.remove('is-admin');
(function () {
  var s = window.socket;
  if (!s) return;
  var list = document.getElementById('phrases-list');
  var MAX_ITEMS = 200;
  var seen = new Set();
  var phraseQueue = [];
  var phraseTimer = null;
  var PHRASE_GAP_MS = 200;

  function placePhraseRandom(el) {
    var cw = list.clientWidth;
    var ch = list.clientHeight;
    if (cw < 8 || ch < 8) return;
    var w = el.offsetWidth;
    var h = el.offsetHeight;
    var maxL = Math.max(0, cw - w);
    var maxT = Math.max(0, ch - h);
    el.style.left = Math.floor(Math.random() * (maxL + 1)) + 'px';
    el.style.top = Math.floor(Math.random() * (maxT + 1)) + 'px';
  }

  function appendPhraseToDom(p) {
    var empty = list.querySelector('.jb-pages-phrases-empty');
    if (empty) empty.remove();
    var el = document.createElement('span');
    el.className = 'jb-pages-phrases-item';
    el.textContent = p;
    el.style.fontSize = (0.5 + Math.random() * 1.5) + 'em';
    list.appendChild(el);
    requestAnimationFrame(function () {
      placePhraseRandom(el);
      el.classList.add('is-visible');
    });
    while (list.childNodes.length > MAX_ITEMS) {
      var first = list.firstChild;
      if (first && first.textContent) {
        seen.delete(first.textContent.toLocaleLowerCase());
      }
      list.removeChild(first);
    }
  }

  function pumpPhrases() {
    phraseTimer = null;
    if (!phraseQueue.length) return;
    var p = phraseQueue.shift();
    appendPhraseToDom(p);
    if (phraseQueue.length) {
      phraseTimer = setTimeout(pumpPhrases, PHRASE_GAP_MS);
    }
  }

  function enqueuePhrases(phrases) {
    if (!Array.isArray(phrases)) return;
    var added = false;
    phrases.forEach(function (raw) {
      var p = String(raw == null ? '' : raw).trim();
      if (!p) return;
      var key = p.toLocaleLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      phraseQueue.push(p);
      added = true;
    });
    if (added && !phraseTimer) {
      pumpPhrases();
    }
  }

  /** Те же токены, что на /pages/words/ из текста шага */
  function wordsFromPlainText(str) {
    if (typeof str !== 'string') return [];
    var s = str.trim();
    if (!s) return [];
    var out = [];
    var re;
    try {
      re = new RegExp('[\\p{L}\\p{N}][\\p{L}\\p{N}\'\\u2019-]*', 'gu');
    } catch (e) {
      re = /[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F'\-]*/g;
    }
    var m;
    var cap = 400;
    while ((m = re.exec(s)) !== null && out.length < cap) {
      if (m[0].length >= 2) out.push(m[0]);
    }
    return out;
  }

  /** Если semantic не дал hrases, показываем биграммы/триграммы из текста шага */
  function phrasesFromPlainText(str) {
    var tokens = wordsFromPlainText(str);
    if (tokens.length < 2) return [];
    var out = [];
    var i;
    var cap = 150;
    for (i = 0; i < tokens.length - 1 && out.length < cap; i++) {
      out.push(tokens[i] + ' ' + tokens[i + 1]);
    }
    for (i = 0; i < tokens.length - 2 && out.length < cap; i++) {
      out.push(tokens[i] + ' ' + tokens[i + 1] + ' ' + tokens[i + 2]);
    }
    return out;
  }

  function ingestPhrases(data) {
    if (!data) return;
    var phrases = [];
    if (Array.isArray(data.noun_phrases)) phrases = phrases.concat(data.noun_phrases);
    if (Array.isArray(data.hrases)) phrases = phrases.concat(data.hrases);
    if (data.analyzed) {
      if (Array.isArray(data.analyzed.noun_phrases)) phrases = phrases.concat(data.analyzed.noun_phrases);
      if (Array.isArray(data.analyzed.hrases)) phrases = phrases.concat(data.analyzed.hrases);
    }
    enqueuePhrases(phrases);
  }

  s.on('analyzed', ingestPhrases);
  s.on('step', function (data) {
    if (!data) return;
    if (data.analyzed) ingestPhrases(data);
    if (typeof data.text === 'string' && data.text.trim().length) {
      enqueuePhrases(phrasesFromPlainText(data.text));
    }
  });
  function isTypingTarget(el) {
    if (!el || !el.tagName) return false;
    var t = el.tagName;
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT';
  }
  document.addEventListener('keydown', function (e) {
    if (isTypingTarget(e.target)) return;
    if (e.key !== 'b' && e.key !== 'B') return;
    e.preventDefault();
    var batch = [];
    for (var i = 0; i < 10; i++) {
      batch.push('phrase ' + Math.random().toString(36).slice(2, 6) + ' ' + Math.random().toString(36).slice(2, 6));
    }
    enqueuePhrases(batch);
  }, true);
})();
</script>
{% endblock %}
