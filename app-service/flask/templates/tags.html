<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamming bot — Tag Cloud</title>
  <link rel="stylesheet" href="/flask_static/dashboard_panels.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: "Lucida Grande", "Droid Sans", Arial, Helvetica, sans-serif;
      font-family: monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      font-size: 8px;
      color: #666;
      z-index: 10;
      display: flex;
      justify-content: space-between;
    }
    nav a { color: #555; text-decoration: none; margin-right: 12px; }
    nav a:hover { color: #fff; }
    #status { color: #888; font-size: 7px; }

    canvas { display: block; cursor: default; }

    #console {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.85);
      border-top: 1px solid #222;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 7px;
      color: #555;
      z-index: 20;
      pointer-events: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #console::-webkit-scrollbar { display: none; }
    #console .line { white-space: pre; margin: 0; }
    #console .ts { color: #333; }
    #console .ws { color: #ff0000; }

    #selected-info {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 14px;
      color: #fff;
      pointer-events: none;
      z-index: 12;
      display: none;
      white-space: nowrap;
    }
    #selected-info.visible { display: block; }

    /** Раскрытие слева направо (прямоугольная маска через clip-path) */
    @keyframes tags-float-reveal-lr {
      from {
        clip-path: inset(0 100% 0 0);
      }
      to {
        clip-path: inset(0 0 0 0);
      }
    }

    /** Живые слова поверх облака (как /pages/words/). */
    #tags-floating-words {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      /* было 12pt (½ от /pages/words/); ×1.5 → 18pt */
      font-size: 18pt;
      line-height: 1.35;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #tags-floating-words .tags-floating-word {
      position: absolute;
      opacity: 1;
      clip-path: inset(0 100% 0 0);
      color: #fff;
      display: inline-flex;
      align-items: center;
      padding: 0.19em 0.41em;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.5);
      box-decoration-break: clone;
      max-width: min(90vw, 360px);
    }
    #tags-floating-words .tags-floating-word.is-visible {
      animation: tags-float-reveal-lr 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /** Фразы поверх облака (как /pages/phrases/): красные чипы, отдельный слой над словами */
    #tags-floating-phrases {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      font-size: clamp(11px, 1.9vw, 17px);
      line-height: 1.3;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #tags-floating-phrases .tags-floating-phrase {
      position: absolute;
      opacity: 1;
      clip-path: inset(0 100% 0 0);
      color: #fff;
      background: #ff0000;
      padding: 2px 8px;
      border-radius: 3px;
      max-width: min(92vw, 520px);
      display: inline-flex;
      align-items: center;
    }
    #tags-floating-phrases .tags-floating-phrase.is-visible {
      animation: tags-float-reveal-lr 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>

<nav>
  <div>
    {% include "components/bot_primary_header_plain.html" %}
  </div>
  <span id="status"></span>
</nav>

<canvas id="cloud"></canvas>
<div id="tags-floating-words" aria-hidden="true"></div>
<div id="tags-floating-phrases" aria-hidden="true"></div>
<div id="selected-info"></div>
<div id="console"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
<script src="/flask_static/d3.layout.cloud.js"></script>
<script>
(function () {
  var API_BASE = {{ tags_api_base|tojson }};
  var API = (API_BASE || '') + '/api/tags/get/';
  /** Sanitized ?days=N or ?day=N (fixed at load); omitted = all-time API. `day` is alias for `days`. */
  var DAYS_QUERY_SUFFIX = (function () {
    var sp = new URLSearchParams(window.location.search);
    var raw = null;
    if (sp.has('days')) raw = sp.get('days');
    else if (sp.has('day')) raw = sp.get('day');
    if (raw === null || raw === '') return '';
    var d = parseInt(raw, 10);
    if (isNaN(d) || d < 0) return '';
    return '?days=' + d;
  })();
  if (DAYS_QUERY_SUFFIX === '?days=0') {
    document.title = 'Jamming bot — Tag Cloud (today)';
  } else if (DAYS_QUERY_SUFFIX === '?days=1') {
    document.title = 'Jamming bot — Tag Cloud (1 day)';
  } else if (DAYS_QUERY_SUFFIX === '?days=7') {
    document.title = 'Jamming bot — Tag Cloud (7 days)';
  }
  /** Совпадает с дефолтом count у /api/tags/get/. */
  var MAX_CLOUD_TAGS = 200;
  var REPEL_RADIUS = 150;
  var REPEL_STRENGTH = 42;
  var FONT = 'monospace';
  /** Все размеры шрифта облака: −30% к прежним. */
  var FONT_SIZE_SCALE = 0.7;
  /** Меньше — плотнее укладка в d3-cloud (px между спрайтами). */
  var CLOUD_PADDING = 3;
  var HIGHLIGHT_COLOR = 'rgb(255,0,0)';
  /** Длительность красной подсветки одного тега после старта его «очереди». */
  var HIGHLIGHT_HOLD_MS = 3000;
  /** Задержка между стартом подсветки соседних тегов в одном событии analyzed (×3 медленнее базового). */
  var HIGHLIGHT_STAGGER_MS = 1500;
  var RESIZE_LAYOUT_MS = 220;
  var layoutGen = 0;
  var lastLayoutSignature = '';
  var resizeLayoutTimer = null;
  var cloudLayoutW = 256;
  var cloudLayoutH = 256;
  var appearRaf = null;
  /** Скорость нарастания alpha при появлении облака (кадр). */
  var APPEAR_OPACITY_SPEED = 0.055;
  /** Пауза между стартом появления соседних тегов, мс (от меньшего размера к большему; ×3 медленнее). */
  var APPEAR_STAGGER_MS = 30;
  /** Сдвиг по X при появлении: в px = доля * кегль тега (лёгкий занос к homeX). */
  var APPEAR_OFFSET_FRAC = 0.2;

  var highlightPulseTimer = null;
  var highlightGen = 0;

  function stopHighlightPulse() {
    if (highlightPulseTimer !== null) {
      clearInterval(highlightPulseTimer);
      highlightPulseTimer = null;
    }
  }

  function highlightTags(names) {
    var list = Array.isArray(names) ? names : [];
    var gen = ++highlightGen;
    stopHighlightPulse();
    if (!list.length) return;
    for (var i = 0; i < list.length; i++) {
      (function (name, idx) {
        setTimeout(function () {
          if (gen !== highlightGen) return;
          var p = particleMap[name];
          if (p) p.highlightUntil = performance.now() + HIGHLIGHT_HOLD_MS;
        }, idx * HIGHLIGHT_STAGGER_MS);
      })(list[i], i);
    }
    var seriesEnd =
      Math.max(0, (list.length - 1) * HIGHLIGHT_STAGGER_MS) +
      HIGHLIGHT_HOLD_MS +
      100;
    highlightPulseTimer = setInterval(function () {
      if (gen !== highlightGen) {
        stopHighlightPulse();
        return;
      }
      var t = performance.now();
      for (var j = 0; j < particles.length; j++) {
        var p = particles[j];
        if (p.highlightUntil && t >= p.highlightUntil) p.highlightUntil = 0;
      }
      redraw();
    }, 33);
    setTimeout(function () {
      if (gen !== highlightGen) return;
      stopHighlightPulse();
      for (var k = 0; k < particles.length; k++) {
        particles[k].highlightUntil = 0;
      }
      redraw();
    }, seriesEnd);
    redraw();
  }

  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('cloud');
  var ctx = canvas.getContext('2d');
  var consoleEl = document.getElementById('console');
  var MAX_LINES = 200;

  function wsLog(msg) {
    var now = new Date();
    var ts = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(function (n) { return n < 10 ? '0' + n : n; }).join(':');
    var line = document.createElement('p');
    line.className = 'line';
    line.innerHTML = '<span class="ts">' + ts + '</span> <span class="ws">' + msg + '</span>';
    consoleEl.appendChild(line);
    while (consoleEl.children.length > MAX_LINES) {
      consoleEl.removeChild(consoleEl.firstChild);
    }
    consoleEl.scrollTop = consoleEl.scrollHeight;
    console.log('[ws] ' + msg);
  }

  var W, H;
  var NAV_OFFSET = 48;
  var contentTop = NAV_OFFSET;
  var contentH = 400;
  var cloudCenterY = 0;
  var particleMap = {};
  var particles = [];
  var lastTagRows = null;
  function syncContentMetrics() {
    contentTop = NAV_OFFSET;
    contentH = Math.max(120, H - contentTop - 16);
    cloudCenterY = contentTop + contentH * 0.5;
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    syncContentMetrics();
    var floatWords = document.getElementById('tags-floating-words');
    if (floatWords) floatWords.style.top = NAV_OFFSET + 'px';
    var floatPhrases = document.getElementById('tags-floating-phrases');
    if (floatPhrases) floatPhrases.style.top = NAV_OFFSET + 'px';
  }
  resize();

  function scheduleResizeLayout() {
    if (resizeLayoutTimer) clearTimeout(resizeLayoutTimer);
    resizeLayoutTimer = setTimeout(function () {
      resizeLayoutTimer = null;
      lastLayoutSignature = '';
      if (lastTagRows && lastTagRows.length) {
        mergeParticles(lastTagRows);
      }
    }, RESIZE_LAYOUT_MS);
  }

  window.addEventListener('resize', function () {
    resize();
    scheduleResizeLayout();
  });

  /**
   * Размер по рангу (0 = самый частый): крупные / средний пояс / мелкий хвост (доли ниже).
   */
  var SIZE_LARGE_FRAC = 0.01;
  var SIZE_MEDIUM_FRAC = 0.2;
  var SMALL_TAIL_EXP = 4.0;

  function calcSizeForRank(rank, total) {
    var ref = Math.min(W, contentH);
    var maxSize = (ref / 8.2) * FONT_SIZE_SCALE;
    var minSize = Math.max(5, ref / 52) * FONT_SIZE_SCALE;
    if (total <= 1) return Math.max(1, Math.round(maxSize));
    var n = total;
    var nL = Math.max(1, Math.round(n * SIZE_LARGE_FRAC));
    var nM = Math.max(1, Math.round(n * SIZE_MEDIUM_FRAC));
    if (nL + nM > n) nM = Math.max(1, n - nL);
    var nS = n - nL - nM;
    var d = maxSize - minSize;
    var span;
    if (rank < nL) {
      var t = nL <= 1 ? 0 : rank / (nL - 1);
      span = 1 - t * 0.14;
    } else if (rank < nL + nM) {
      var i = rank - nL;
      var u = nM <= 1 ? 0 : i / (nM - 1);
      span = 0.8 - u * 0.26;
    } else if (nS <= 0) {
      span = 0.5;
    } else {
      var j = rank - nL - nM;
      var v = nS <= 1 ? 0 : j / (nS - 1);
      span = 0.52 * Math.pow(1 - v, SMALL_TAIL_EXP);
    }
    return Math.max(minSize, Math.round(minSize + span * d));
  }

  var WORD_COLOR = '#4d4d4d';
  /** Цвет короткой случайной вспышки по случайному тегу (запускается после appear-анимации). */
  var RANDOM_FLASH_COLOR = '#ffffff';
  /** Интервал выбора случайного тега для вспышки после появления облака (×3 медленнее базовых 50 мс). */
  var RANDOM_FLASH_INTERVAL_MS = 150;
  /** Длительность одной случайной вспышки (×3). */
  var RANDOM_FLASH_HOLD_MS = 150;
  var randomFlashTimer = null;

  /** Как на [Word Cloud](https://www.jasondavies.com/wordcloud/): в основном горизонтально, часть вертикально. */
  function cloudRotateDeg(text) {
    var s = String(text || '');
    var h = 0;
    for (var i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0;
    }
    return (Math.abs(h) % 10) < 6 ? 0 : 90;
  }

  function measureWord(text, size) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    return ctx.measureText(text).width;
  }

  function tagsSignature(rows) {
    var copy = rows.slice().sort(function (a, b) {
      if (a.name < b.name) return -1;
      if (a.name > b.name) return 1;
      return 0;
    });
    var parts = [];
    for (var i = 0; i < copy.length; i++) {
      parts.push(copy[i].name + ':' + copy[i].count);
    }
    return parts.join('|');
  }

  function rowsForCloudLayout(tagRows) {
    var sorted = tagRows.slice().sort(function (a, b) {
      return (b.count || 0) - (a.count || 0);
    });
    return sorted.slice(0, Math.min(sorted.length, MAX_CLOUD_TAGS));
  }

  function runCloudLayout(rows, callback) {
    if (typeof d3 === 'undefined' || !d3.layout || typeof d3.layout.cloud !== 'function') {
      console.error('d3.layout.cloud is not available');
      callback([]);
      return;
    }
    var nRows = rows.length;
    var words = [];
    for (var j = 0; j < nRows; j++) {
      var r = rows[j];
      words.push({
        text: r.name,
        size: calcSizeForRank(j, nRows),
        count: r.count
      });
    }
    /* Размер полотна ≈ как у области контента — то же соотношение сторон, что и у экрана под навбаром (d3 кладёт слова в этот прямоугольник). */
    var layoutW = Math.max(64, Math.floor(W * 0.96));
    var layoutH = Math.max(64, Math.floor(contentH * 0.96));
    cloudLayoutW = layoutW;
    cloudLayoutH = layoutH;
    var myGen = ++layoutGen;
    d3.layout.cloud()
      .size([layoutW, layoutH])
      .words(words)
      .padding(CLOUD_PADDING)
      .font(FONT)
      .fontStyle('normal')
      .fontWeight('bold')
      .fontSize(function (d) { return d.size; })
      .rotate(function (d) {
        return cloudRotateDeg(d.text);
      })
      .spiral('archimedean')
      .on('end', function (placedWords) {
        if (myGen !== layoutGen) return;
        callback(placedWords || []);
      })
      .start();
  }

  function applyLayoutFromPlaced(placedWords) {
    var placedMap = {};
    for (var i = 0; i < placedWords.length; i++) {
      var w = placedWords[i];
      placedMap[w.text] = w;
    }
    var marginX = 0.02;
    var marginY = 0.025;
    var availW = W * (1 - 2 * marginX);
    var availH = contentH * (1 - 2 * marginY);
    var cx = W * 0.5;
    var cy = cloudCenterY;

    var minLx = Infinity;
    var maxLx = -Infinity;
    var minLy = Infinity;
    var maxLy = -Infinity;
    for (var bi = 0; bi < placedWords.length; bi++) {
      var bw = placedWords[bi];
      if (typeof bw.x !== 'number' || bw.x0 == null) continue;
      minLx = Math.min(minLx, bw.x + bw.x0);
      maxLx = Math.max(maxLx, bw.x + bw.x1);
      minLy = Math.min(minLy, bw.y + bw.y0);
      maxLy = Math.max(maxLy, bw.y + bw.y1);
    }
    var bboxW = maxLx - minLx;
    var bboxH = maxLy - minLy;
    var midX = (minLx + maxLx) * 0.5;
    var midY = (minLy + maxLy) * 0.5;
    var packScale;
    if (!isFinite(bboxW) || !isFinite(bboxH) || bboxW < 12 || bboxH < 12) {
      packScale = Math.min(availW / cloudLayoutW, availH / cloudLayoutH);
      midX = 0;
      midY = 0;
    } else {
      packScale = Math.min(availW / bboxW, availH / bboxH) * 0.97;
    }

    /** Лёгкий овал по aspect ratio; коэффициенты ближе к 1 — меньше «дыр» по краям. */
    var contentAR = W / Math.max(120, contentH);
    var ovalKX;
    var ovalKY;
    if (contentAR >= 1) {
      ovalKX = 1.01 + 0.06 * Math.min(1, (contentAR - 1) / 1.6);
      ovalKY = 0.99 - 0.05 * Math.min(1, (contentAR - 1) / 1.6);
    } else {
      ovalKX = 0.99 + 0.04 * Math.min(1, 1 / contentAR - 1);
      ovalKY = 1.005 + 0.03 * Math.min(1, 1 / contentAR - 1);
    }
    ovalKX = Math.min(1.1, Math.max(0.98, ovalKX));
    ovalKY = Math.min(1.03, Math.max(0.92, ovalKY));
    for (var k in particleMap) {
      var p = particleMap[k];
      var pl = placedMap[k];
      if (pl) {
        p.homeX = cx + (pl.x - midX) * packScale * ovalKX;
        p.homeY = cy + (pl.y - midY) * packScale * ovalKY;
        p.rotate = typeof pl.rotate === 'number' ? pl.rotate : 0;
        var fs = p.targetSize || p.size;
        p._w = measureWord(p.text, fs);
        p._h = fs;
      }
    }
  }

  function pruneUnplacedParticles(placedWords) {
    var placedSet = {};
    for (var i = 0; i < placedWords.length; i++) {
      placedSet[placedWords[i].text] = true;
    }
    for (var key in particleMap) {
      if (!placedSet[key]) delete particleMap[key];
    }
    particles = [];
    for (var k in particleMap) {
      particles.push(particleMap[k]);
    }
  }

  function syncParticlesLayout(fullOpacity) {
    var op = fullOpacity !== false;
    for (var key in particleMap) {
      var p = particleMap[key];
      if (p.targetSize != null) p.size = p.targetSize;
      if (p.targetColor != null) p.color = p.targetColor;
      p.x = p.homeX;
      p.y = p.homeY;
      if (op) p.opacity = 1;
    }
  }

  function cancelAppearAnimation() {
    if (appearRaf != null) {
      cancelAnimationFrame(appearRaf);
      appearRaf = null;
    }
  }

  function stopRandomFlash() {
    if (randomFlashTimer !== null) {
      clearInterval(randomFlashTimer);
      randomFlashTimer = null;
    }
    for (var i = 0; i < particles.length; i++) {
      particles[i].flashUntil = 0;
    }
  }

  function startRandomFlash() {
    stopRandomFlash();
    if (!particles.length) return;
    randomFlashTimer = setInterval(function () {
      if (!particles.length) {
        stopRandomFlash();
        return;
      }
      var idx = Math.floor(Math.random() * particles.length);
      var p = particles[idx];
      if (p) p.flashUntil = performance.now() + RANDOM_FLASH_HOLD_MS;
      redraw();
    }, RANDOM_FLASH_INTERVAL_MS);
  }

  function snapParticlesToHome() {
    for (var key in particleMap) {
      var p = particleMap[key];
      p.x = p.homeX;
      p.y = p.homeY;
      p.opacity = 1;
    }
  }

  /** После новой d3-cloud укладки: по одному с шагом APPEAR_STAGGER_MS (от меньшего size к большему), fade-in + лёгкий сдвиг по X на 0.2×кегль к позиции. */
  function startAppearAnimation() {
    cancelAppearAnimation();
    stopRandomFlash();
    for (var key in particleMap) {
      var p = particleMap[key];
      if (p.targetSize != null) p.size = p.targetSize;
      if (p.targetColor != null) p.color = p.targetColor;
      var fs0 = typeof p.size === 'number' ? p.size : 12;
      p.x = p.homeX - APPEAR_OFFSET_FRAC * fs0;
      p.y = p.homeY;
      p.opacity = 0;
      p.flashUntil = 0;
    }
    var order = particles.slice().sort(function (a, b) {
      var sa = typeof a.targetSize === 'number' ? a.targetSize : a.size;
      var sb = typeof b.targetSize === 'number' ? b.targetSize : b.size;
      if (sa !== sb) return sa - sb;
      if (a.text < b.text) return -1;
      if (a.text > b.text) return 1;
      return 0;
    });
    var t0 = performance.now();
    function tick() {
      var now = performance.now();
      var settling = false;
      for (var i = 0; i < order.length; i++) {
        var p = order[i];
        var delayMs = i * APPEAR_STAGGER_MS;
        var fs = typeof p.size === 'number' ? p.size : 12;
        var off = APPEAR_OFFSET_FRAC * fs;
        p.y = p.homeY;
        if (now - t0 < delayMs) {
          p.opacity = 0;
          p.x = p.homeX - off;
          settling = true;
          continue;
        }
        p.opacity = Math.min(1, p.opacity + APPEAR_OPACITY_SPEED);
        var u = Math.min(1, p.opacity);
        p.x = p.homeX - (1 - u) * off;
        if (p.opacity < 0.995) settling = true;
      }
      redraw();
      if (settling) {
        appearRaf = requestAnimationFrame(tick);
      } else {
        snapParticlesToHome();
        redraw();
        appearRaf = null;
        startRandomFlash();
      }
    }
    tick();
  }

  function mergeParticles(tagRows) {
    lastTagRows = tagRows;
    var sig = tagsSignature(tagRows);
    var rowsForCloud = rowsForCloudLayout(tagRows);
    var nCloud = rowsForCloud.length;

    var newMap = {};

    for (var i = 0; i < rowsForCloud.length; i++) {
      var t = rowsForCloud[i];
      var key = t.name;
      var size = calcSizeForRank(i, nCloud);
      var color = WORD_COLOR;

      if (particleMap[key]) {
        var p = particleMap[key];
        if (typeof p.highlightUntil !== 'number') p.highlightUntil = 0;
        if (typeof p.flashUntil !== 'number') p.flashUntil = 0;
        p.targetSize = size;
        p.targetColor = color;
        p.count = t.count;
        p._w = measureWord(p.text, size);
        p._h = size;
        newMap[key] = p;
      } else {
        var p = {
          text: t.name,
          count: t.count,
          size: size,
          targetSize: size,
          color: color,
          targetColor: color,
          homeX: W / 2, homeY: H / 2,
          x: W / 2, y: H / 2,
          opacity: 0,
          highlightUntil: 0,
          flashUntil: 0,
          rotate: 0,
          _w: 0, _h: 0
        };
        p._w = measureWord(p.text, size);
        p._h = size;
        newMap[key] = p;
      }
    }

    particleMap = newMap;
    particles = [];
    for (var key in particleMap) {
      particles.push(particleMap[key]);
    }

    function finishLayout(placedWords) {
      applyLayoutFromPlaced(placedWords || []);
      pruneUnplacedParticles(placedWords || []);
      startAppearAnimation();
    }

    if (sig !== lastLayoutSignature) {
      lastLayoutSignature = sig;
      runCloudLayout(rowsForCloud, finishLayout);
    } else {
      cancelAppearAnimation();
      syncParticlesLayout();
      redraw();
    }
  }

  function fetchAndDraw() {
    statusEl.textContent = 'updating…';
    fetch(API + DAYS_QUERY_SUFFIX)
      .then(function (r) { return r.json(); })
      .then(function (tags) {
        if (!tags || !tags.length) {
          statusEl.textContent = 'no tags';
          return;
        }
        mergeParticles(tags);
        var shown = Object.keys(particleMap).length;
        statusEl.textContent =
          tags.length + ' tags · cloud ' + shown + (tags.length > MAX_CLOUD_TAGS ? ' (top ' + MAX_CLOUD_TAGS + ' by count)' : '');
      })
      .catch(function (err) {
        console.error(err);
        statusEl.textContent = 'error';
      });
  }

  function parseColorRgb(str) {
    if (!str) return [128, 128, 128];
    var s = String(str).trim();
    if (s.charAt(0) === '#') {
      var hex = s.slice(1);
      if (hex.length === 6) {
        return [
          parseInt(hex.slice(0, 2), 16),
          parseInt(hex.slice(2, 4), 16),
          parseInt(hex.slice(4, 6), 16)
        ];
      }
    }
    var m = s.match(/\d+/g);
    if (m && m.length >= 3) return [Number(m[0]), Number(m[1]), Number(m[2])];
    return [128, 128, 128];
  }

  function lerpColor(from, to, t) {
    var f = parseColorRgb(from);
    var tt = parseColorRgb(to);
    var r = Math.round(f[0] + (tt[0] - f[0]) * t);
    var g = Math.round(f[1] + (tt[1] - f[1]) * t);
    var b = Math.round(f[2] + (tt[2] - f[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function redraw() {
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var baseOp = typeof p.opacity === 'number' ? p.opacity : 1;
      if (baseOp <= 0) continue;

      var fontSize = Math.round(p.size);
      ctx.font = 'bold ' + fontSize + 'px ' + FONT;

      var rot = typeof p.rotate === 'number' ? p.rotate : 0;
      var rad = rot * Math.PI / 180;

      function drawLabel(fill, alpha, shadowBlur) {
        ctx.save();
        ctx.translate(p.x, p.y);
        if (rad) ctx.rotate(rad);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = fill;
        if (shadowBlur) {
          ctx.shadowColor = HIGHLIGHT_COLOR;
          ctx.shadowBlur = shadowBlur;
        } else if (alpha > 0.4) {
          ctx.shadowColor = 'rgba(0,0,0,0.85)';
          ctx.shadowBlur = 3;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 1;
        }
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
      }

      var op = baseOp;
      var nowHl = performance.now();
      var ht =
        p.highlightUntil && nowHl < p.highlightUntil ? 1 : 0;
      var fl =
        p.flashUntil && nowHl < p.flashUntil ? 1 : 0;
      if (ht > 0) {
        drawLabel(HIGHLIGHT_COLOR, op * ht * 0.6, 20 * ht);
        drawLabel(lerpColor(p.color, HIGHLIGHT_COLOR, ht), op, 0);
      } else if (fl > 0) {
        drawLabel(RANDOM_FLASH_COLOR, op, 0);
      } else {
        drawLabel(p.color, op, 0);
      }
    }
    ctx.globalAlpha = 1;
  }

  var selectedInfoEl = document.getElementById('selected-info');

  function findParticleAt(mx, my) {
    /* Iterate в обратном порядке — получаем верхний (последний нарисованный) при перекрытии. */
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      if (!p || (typeof p.opacity === 'number' && p.opacity <= 0)) continue;
      var w = p._w || 0;
      var h = p._h || 0;
      if (w <= 0 || h <= 0) continue;
      var dx = mx - p.x;
      var dy = my - p.y;
      var rad = (typeof p.rotate === 'number' ? p.rotate : 0) * Math.PI / 180;
      var lx = dx * Math.cos(rad) + dy * Math.sin(rad);
      var ly = -dx * Math.sin(rad) + dy * Math.cos(rad);
      if (Math.abs(lx) <= w / 2 && Math.abs(ly) <= h / 2) {
        return p;
      }
    }
    return null;
  }

  function hideSelectedInfo() {
    if (selectedInfoEl) {
      selectedInfoEl.textContent = '';
      selectedInfoEl.classList.remove('visible');
    }
  }

  canvas.addEventListener('mousemove', function (ev) {
    if (!selectedInfoEl) return;
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left;
    var my = ev.clientY - rect.top;
    var p = findParticleAt(mx, my);
    if (p) {
      var count = typeof p.count === 'number' ? p.count : (p.count || 0);
      selectedInfoEl.textContent = p.text + ' — ' + count;
      selectedInfoEl.classList.add('visible');
      canvas.style.cursor = 'pointer';
    } else {
      hideSelectedInfo();
      canvas.style.cursor = 'default';
    }
  });

  canvas.addEventListener('mouseleave', function () {
    hideSelectedInfo();
    canvas.style.cursor = 'default';
  });

  fetchAndDraw();

  /** Плавающие слова поверх облака (логика как /pages/words/; кегль ×1.5 от прежних 12pt). */
  (function () {
    var list = document.getElementById('tags-floating-words');
    if (!list) return;
    var MAX_WORDS = 600;
    var seen = new Set();
    var wordQueue = [];
    var wordTimer = null;
    var WORD_GAP_MS = 200;

    function placeWordRandom(el) {
      var cw = list.clientWidth;
      var ch = list.clientHeight;
      if (cw < 8 || ch < 8) return;
      var w = el.offsetWidth;
      var h = el.offsetHeight;
      var maxL = Math.max(0, cw - w);
      var maxT = Math.max(0, ch - h);
      el.style.left = Math.floor(Math.random() * (maxL + 1)) + 'px';
      el.style.top = Math.floor(Math.random() * (maxT + 1)) + 'px';
    }

    function appendWordToDom(w) {
      var el = document.createElement('span');
      el.className = 'tags-floating-word';
      el.textContent = w;
      el.style.fontSize = (0.5 + Math.random() * 1.5) + 'em';
      list.appendChild(el);
      requestAnimationFrame(function () {
        placeWordRandom(el);
        el.classList.add('is-visible');
      });
      while (list.childNodes.length > MAX_WORDS) {
        var first = list.firstChild;
        if (first && first.textContent) {
          seen.delete(first.textContent.toLocaleLowerCase());
        }
        list.removeChild(first);
      }
    }

    function pumpWords() {
      wordTimer = null;
      if (!wordQueue.length) return;
      var w = wordQueue.shift();
      appendWordToDom(w);
      if (wordQueue.length) {
        wordTimer = setTimeout(pumpWords, WORD_GAP_MS);
      }
    }

    function wordsFromPlainText(str) {
      if (typeof str !== 'string') return [];
      var s = str.trim();
      if (!s) return [];
      var out = [];
      var re;
      try {
        re = new RegExp('[\\p{L}\\p{N}][\\p{L}\\p{N}\'\\u2019-]*', 'gu');
      } catch (e) {
        re = /[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F'\-]*/g;
      }
      var m;
      var cap = 400;
      while ((m = re.exec(s)) !== null && out.length < cap) {
        if (m[0].length >= 2) out.push(m[0]);
      }
      return out;
    }

    function enqueueWords(words) {
      if (!Array.isArray(words)) return;
      var added = false;
      words.forEach(function (raw) {
        var w = String(raw == null ? '' : raw).trim();
        if (!w) return;
        var key = w.toLocaleLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        wordQueue.push(w);
        added = true;
      });
      if (added && !wordTimer) {
        pumpWords();
      }
    }

    function ingestFloating(data) {
      if (!data) return;
      var words = [];
      if (Array.isArray(data.words)) words = words.concat(data.words);
      if (Array.isArray(data.tags)) words = words.concat(data.tags);
      if (typeof data.words_str === 'string') {
        words = words.concat(data.words_str.split(/\s+/));
      }
      if (data.analyzed && Array.isArray(data.analyzed.words)) {
        words = words.concat(data.analyzed.words);
      }
      enqueueWords(words);
    }

    window.tagsFloatingWordsIngest = ingestFloating;
    window.tagsFloatingWordsOnStep = function (data) {
      if (!data) return;
      if (data.analyzed) ingestFloating(data);
      if (typeof data.text === 'string' && data.text.trim().length) {
        ingestFloating({ words: wordsFromPlainText(data.text) });
      }
    };
  })();

  /** Плавающие фразы (как /pages/phrases/): noun_phrases / hrases + биграммы из step.text */
  (function () {
    var list = document.getElementById('tags-floating-phrases');
    if (!list) return;
    var MAX_ITEMS = 200;
    var seen = new Set();
    var phraseQueue = [];
    var phraseTimer = null;
    var PHRASE_GAP_MS = 200;

    function placePhraseRandom(el) {
      var cw = list.clientWidth;
      var ch = list.clientHeight;
      if (cw < 8 || ch < 8) return;
      var w = el.offsetWidth;
      var h = el.offsetHeight;
      var maxL = Math.max(0, cw - w);
      var maxT = Math.max(0, ch - h);
      el.style.left = Math.floor(Math.random() * (maxL + 1)) + 'px';
      el.style.top = Math.floor(Math.random() * (maxT + 1)) + 'px';
    }

    function appendPhraseToDom(p) {
      var el = document.createElement('span');
      el.className = 'tags-floating-phrase';
      el.textContent = p;
      el.style.fontSize = (0.5 + Math.random() * 1.5) + 'em';
      list.appendChild(el);
      requestAnimationFrame(function () {
        placePhraseRandom(el);
        el.classList.add('is-visible');
      });
      while (list.childNodes.length > MAX_ITEMS) {
        var first = list.firstChild;
        if (first && first.textContent) {
          seen.delete(first.textContent.toLocaleLowerCase());
        }
        list.removeChild(first);
      }
    }

    function pumpPhrases() {
      phraseTimer = null;
      if (!phraseQueue.length) return;
      var p = phraseQueue.shift();
      appendPhraseToDom(p);
      if (phraseQueue.length) {
        phraseTimer = setTimeout(pumpPhrases, PHRASE_GAP_MS);
      }
    }

    function wordsFromPlainText(str) {
      if (typeof str !== 'string') return [];
      var s = str.trim();
      if (!s) return [];
      var out = [];
      var re;
      try {
        re = new RegExp('[\\p{L}\\p{N}][\\p{L}\\p{N}\'\\u2019-]*', 'gu');
      } catch (e) {
        re = /[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F'\-]*/g;
      }
      var m;
      var cap = 400;
      while ((m = re.exec(s)) !== null && out.length < cap) {
        if (m[0].length >= 2) out.push(m[0]);
      }
      return out;
    }

    function phrasesFromPlainText(str) {
      var tokens = wordsFromPlainText(str);
      if (tokens.length < 2) return [];
      var out = [];
      var i;
      var cap = 150;
      for (i = 0; i < tokens.length - 1 && out.length < cap; i++) {
        out.push(tokens[i] + ' ' + tokens[i + 1]);
      }
      for (i = 0; i < tokens.length - 2 && out.length < cap; i++) {
        out.push(tokens[i] + ' ' + tokens[i + 1] + ' ' + tokens[i + 2]);
      }
      return out;
    }

    function enqueuePhrases(phrases) {
      if (!Array.isArray(phrases)) return;
      var added = false;
      phrases.forEach(function (raw) {
        var p = String(raw == null ? '' : raw).trim();
        if (!p) return;
        var key = p.toLocaleLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        phraseQueue.push(p);
        added = true;
      });
      if (added && !phraseTimer) {
        pumpPhrases();
      }
    }

    function ingestPhrasesFloating(data) {
      if (!data) return;
      var phrases = [];
      if (Array.isArray(data.noun_phrases)) phrases = phrases.concat(data.noun_phrases);
      if (Array.isArray(data.hrases)) phrases = phrases.concat(data.hrases);
      if (data.analyzed) {
        if (Array.isArray(data.analyzed.noun_phrases)) phrases = phrases.concat(data.analyzed.noun_phrases);
        if (Array.isArray(data.analyzed.hrases)) phrases = phrases.concat(data.analyzed.hrases);
      }
      enqueuePhrases(phrases);
    }

    window.tagsFloatingPhrasesIngest = ingestPhrasesFloating;
    window.tagsFloatingPhrasesOnStep = function (data) {
      if (!data) return;
      if (data.analyzed) ingestPhrasesFloating(data);
      if (typeof data.text === 'string' && data.text.trim().length) {
        enqueuePhrases(phrasesFromPlainText(data.text));
      }
    };
  })();

  var socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', function () {
    statusEl.textContent = 'live';
    wsLog('connected');
  });
  socket.on('tags_updated', function (data) {
    wsLog('tags_updated' + (data ? ' ' + JSON.stringify(data) : ''));
  });
  socket.on('step', function (data) {
    if (window.tagsFloatingWordsOnStep) window.tagsFloatingWordsOnStep(data);
    if (window.tagsFloatingPhrasesOnStep) window.tagsFloatingPhrasesOnStep(data);
    wsLog('step ' + (data && data.url ? data.url : JSON.stringify(data)));
  });
  socket.on('screenshot', function (data) {
    wsLog('screenshot ' + (data && data.screenshot_url ? data.screenshot_url : JSON.stringify(data)));
  });
  socket.on('location', function (data) {
    wsLog('location ' + JSON.stringify(data));
  });
  socket.on('analyzed', function (data) {
    if (window.tagsFloatingWordsIngest) window.tagsFloatingWordsIngest(data);
    if (window.tagsFloatingPhrasesIngest) window.tagsFloatingPhrasesIngest(data);
    if (data && data.tags) {
      highlightTags(data.tags);
    }
    wsLog('analyzed ' + JSON.stringify(data));
  });
  socket.on('disconnect', function () {
    statusEl.textContent = 'disconnected';
    wsLog('disconnected');
  });
})();
</script>
