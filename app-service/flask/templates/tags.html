<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamming bot — Tag Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: "Lucida Grande", "Droid Sans", Arial, Helvetica, sans-serif;
      font-family: monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      font-size: 11px;
      color: #666;
      z-index: 10;
      display: flex;
      justify-content: space-between;
    }
    nav a { color: #555; text-decoration: none; margin-right: 12px; }
    nav a:hover { color: #fff; }
    #status { color: #333; font-size: 10px; }

    canvas { display: block; cursor: default; }

    #console {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.85);
      border-top: 1px solid #222;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 10px;
      color: #555;
      z-index: 20;
      pointer-events: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #console::-webkit-scrollbar { display: none; }
    #console .line { white-space: pre; margin: 0; }
    #console .ts { color: #333; }
    #console .ws { color: #4a8; }
  </style>
</head>
<body>

<nav>
  <div>
    {% include "components/explorer_nav_plain.html" %}
  </div>
  <span id="status"></span>
</nav>

<canvas id="cloud"></canvas>
<div id="console"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
<script src="/flask_static/d3.layout.cloud.js"></script>
<script>
(function () {
  var API = '/api/tags/get/';
  var REFRESH_INTERVAL = 30000;
  var REPEL_RADIUS = 150;
  var REPEL_STRENGTH = 80;
  var RETURN_SPEED = 0.06;
  var FONT = 'monospace';
  var PAD = 6;
  var HIGHLIGHT_COLOR = 'rgb(0,255,160)';
  var HIGHLIGHT_DECAY = 0.015;
  var FLOAT_AMPLITUDE = 8;
  var RESIZE_LAYOUT_MS = 220;
  var layoutGen = 0;
  var lastLayoutSignature = '';
  var resizeLayoutTimer = null;

  function highlightTags(names) {
    for (var i = 0; i < names.length; i++) {
      var p = particleMap[names[i]];
      if (p && !p.removing) {
        p.highlightT = 1.0;
      }
    }
  }

  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('cloud');
  var ctx = canvas.getContext('2d');
  var consoleEl = document.getElementById('console');
  var MAX_LINES = 200;

  function wsLog(msg) {
    var now = new Date();
    var ts = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(function (n) { return n < 10 ? '0' + n : n; }).join(':');
    var line = document.createElement('p');
    line.className = 'line';
    line.innerHTML = '<span class="ts">' + ts + '</span> <span class="ws">' + msg + '</span>';
    consoleEl.appendChild(line);
    while (consoleEl.children.length > MAX_LINES) {
      consoleEl.removeChild(consoleEl.firstChild);
    }
    consoleEl.scrollTop = consoleEl.scrollHeight;
    console.log('[ws] ' + msg);
  }

  var W, H;
  var mouse = { x: -9999, y: -9999 };
  var particleMap = {};
  var particles = [];
  var raf;
  var lastTagRows = null;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  resize();

  function scheduleResizeLayout() {
    if (resizeLayoutTimer) clearTimeout(resizeLayoutTimer);
    resizeLayoutTimer = setTimeout(function () {
      resizeLayoutTimer = null;
      lastLayoutSignature = '';
      if (lastTagRows && lastTagRows.length) {
        mergeParticles(lastTagRows);
      }
    }, RESIZE_LAYOUT_MS);
  }

  window.addEventListener('resize', function () {
    resize();
    scheduleResizeLayout();
  });

  canvas.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  canvas.addEventListener('mouseleave', function () {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
  }, { passive: false });
  canvas.addEventListener('touchend', function () {
    mouse.x = -9999;
    mouse.y = -9999;
  });
  canvas.addEventListener('touchcancel', function () {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  function calcSize(count, maxCount) {
    var minSize = 11;
    var maxSize = Math.min(W, H) / 9;
    var ratio = Math.sqrt(count / maxCount);
    return minSize + ratio * (maxSize - minSize);
  }

  function calcColor(count, maxCount) {
    var ratio = Math.sqrt(count / maxCount);
    var bright = 35 + Math.round(ratio * 190);
    return 'rgb(' + bright + ',' + bright + ',' + bright + ')';
  }

  function measureWord(text, size) {
    ctx.font = size + 'px ' + FONT;
    return ctx.measureText(text).width;
  }

  function tagsSignature(rows) {
    var copy = rows.slice().sort(function (a, b) {
      if (a.name < b.name) return -1;
      if (a.name > b.name) return 1;
      return 0;
    });
    var parts = [];
    for (var i = 0; i < copy.length; i++) {
      parts.push(copy[i].name + ':' + copy[i].count);
    }
    return parts.join('|');
  }

  function runCloudLayout(rows, callback) {
    if (typeof d3 === 'undefined' || !d3.layout || typeof d3.layout.cloud !== 'function') {
      console.error('d3.layout.cloud is not available');
      callback([]);
      return;
    }
    var maxCount = 1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].count > maxCount) maxCount = rows[i].count;
    }
    var words = [];
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      words.push({
        text: r.name,
        size: Math.round(calcSize(r.count, maxCount)),
        count: r.count
      });
    }
    var myGen = ++layoutGen;
    d3.layout.cloud()
      .size([W, H])
      .words(words)
      .padding(PAD)
      .font(FONT)
      .fontStyle('normal')
      .fontWeight('normal')
      .fontSize(function (d) { return d.size; })
      .rotate(function () { return Math.random() < 0.5 ? 0 : 90; })
      .on('end', function (placedWords) {
        if (myGen !== layoutGen) return;
        callback(placedWords || []);
      })
      .start();
  }

  function applyLayoutFromPlaced(placedWords) {
    var placedMap = {};
    for (var i = 0; i < placedWords.length; i++) {
      var w = placedWords[i];
      placedMap[w.text] = w;
    }
    var nActive = 0;
    for (var key in particleMap) {
      if (!particleMap[key].removing) nActive++;
    }
    if (placedWords.length < nActive) {
      console.warn('[tags cloud] placed ' + placedWords.length + ' / ' + nActive);
    }
    for (var k in particleMap) {
      var p = particleMap[k];
      if (p.removing) continue;
      var pl = placedMap[k];
      if (pl) {
        p.homeX = W / 2 + pl.x;
        p.homeY = H / 2 + pl.y;
        p.rotate = typeof pl.rotate === 'number' ? pl.rotate : 0;
        var fs = p.targetSize || p.size;
        p._w = measureWord(p.text, fs);
        p._h = fs;
      } else {
        p.homeX = W / 2;
        p.homeY = H / 2;
        p.rotate = 0;
      }
    }
  }

  function ambientNoiseOffset(p, timeSec) {
    var phase = p.noisePhase || 0;
    return {
      x: Math.sin(timeSec * 0.42 + phase) * p.driftAmp + Math.cos(timeSec * 0.17 + phase * 0.7) * p.driftAmp * 0.35,
      y: Math.cos(timeSec * 0.36 + phase * 1.3) * p.driftAmp * 0.7 + Math.sin(timeSec * 0.21 + phase * 0.4) * p.driftAmp * 0.28
    };
  }

  function mergeParticles(tagRows) {
    lastTagRows = tagRows;
    var sig = tagsSignature(tagRows);
    var maxCount = 1;
    for (var i = 0; i < tagRows.length; i++) {
      if (tagRows[i].count > maxCount) maxCount = tagRows[i].count;
    }

    var newMap = {};

    for (var i = 0; i < tagRows.length; i++) {
      var t = tagRows[i];
      var key = t.name;
      var size = calcSize(t.count, maxCount);
      var color = calcColor(t.count, maxCount);

      if (particleMap[key]) {
        var p = particleMap[key];
        p.targetSize = size;
        p.targetColor = color;
        p.count = t.count;
        p._w = measureWord(p.text, size);
        p._h = size;
        p.removing = false;
        p.opacity = typeof p.opacity === 'number' ? p.opacity : 1;
        newMap[key] = p;
      } else {
        var p = {
          text: t.name,
          count: t.count,
          size: size * 0.01,
          targetSize: size,
          color: color,
          targetColor: color,
          homeX: W / 2, homeY: H / 2,
          x: W / 2, y: H / 2,
          vx: 0, vy: 0,
          opacity: 0,
          removing: false,
          highlightT: 0,
          noisePhase: Math.random() * Math.PI * 2,
          driftAmp: 1.5 + Math.random() * FLOAT_AMPLITUDE,
          rotate: 0,
          _w: 0, _h: 0
        };
        p._w = measureWord(p.text, size);
        p._h = size;
        newMap[key] = p;
      }
    }

    for (var key in particleMap) {
      if (!newMap[key]) {
        var p = particleMap[key];
        p.removing = true;
        newMap[key] = p;
      }
    }

    particleMap = newMap;
    particles = [];
    for (var key in particleMap) {
      particles.push(particleMap[key]);
    }

    if (sig !== lastLayoutSignature) {
      lastLayoutSignature = sig;
      runCloudLayout(tagRows, function (placedWords) {
        applyLayoutFromPlaced(placedWords);
      });
    }
  }

  function fetchAndDraw() {
    statusEl.textContent = 'updating…';
    fetch(API)
      .then(function (r) { return r.json(); })
      .then(function (tags) {
        if (!tags || !tags.length) {
          statusEl.textContent = 'no tags';
          return;
        }
        mergeParticles(tags);
        if (!raf) animate();
        statusEl.textContent = tags.length + ' tags';
      })
      .catch(function (err) {
        console.error(err);
        statusEl.textContent = 'error';
      });
  }

  function lerpColor(from, to, t) {
    var f = from.match(/\d+/g).map(Number);
    var tt = to.match(/\d+/g).map(Number);
    var r = Math.round(f[0] + (tt[0] - f[0]) * t);
    var g = Math.round(f[1] + (tt[1] - f[1]) * t);
    var b = Math.round(f[2] + (tt[2] - f[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    var nowSec = performance.now() * 0.001;

    var toRemove = [];

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      // Animate size towards target
      if (p.targetSize) {
        p.size += (p.targetSize - p.size) * 0.08;
      }

      // Animate color
      if (p.targetColor && p.color !== p.targetColor) {
        p.color = lerpColor(p.color, p.targetColor, 0.08);
      }

      // Fade in new / fade out removed
      if (p.removing) {
        p.opacity -= 0.02;
        if (p.opacity <= 0) {
          toRemove.push(p.text);
          continue;
        }
      } else if (p.opacity < 1) {
        p.opacity = Math.min(1, p.opacity + 0.03);
      }

      // Mouse repel
      var dx = p.x - mouse.x;
      var dy = p.y - mouse.y;
      var dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < REPEL_RADIUS && dist > 0) {
        var force = (REPEL_RADIUS - dist) / REPEL_RADIUS * REPEL_STRENGTH;
        p.vx += (dx / dist) * force * 0.08;
        p.vy += (dy / dist) * force * 0.08;
      }

      // Spring back to home
      var drift = ambientNoiseOffset(p, nowSec);
      p.vx += (p.homeX + drift.x - p.x) * RETURN_SPEED;
      p.vy += (p.homeY + drift.y - p.y) * RETURN_SPEED;

      p.vx *= 0.82;
      p.vy *= 0.82;

      p.x += p.vx;
      p.y += p.vy;

      // Highlight decay
      if (p.highlightT > 0) {
        p.highlightT = Math.max(0, p.highlightT - HIGHLIGHT_DECAY);
      }

      // Draw (support d3-cloud rotation: 0° / 90°)
      var fontSize = Math.round(p.size);
      ctx.font = fontSize + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      var rot = typeof p.rotate === 'number' ? p.rotate : 0;
      var rad = rot * Math.PI / 180;

      function drawLabel(fill, alpha, shadowBlur) {
        ctx.save();
        ctx.translate(p.x, p.y);
        if (rad) ctx.rotate(rad);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = fill;
        if (shadowBlur) {
          ctx.shadowColor = HIGHLIGHT_COLOR;
          ctx.shadowBlur = shadowBlur;
        }
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
      }

      if (p.highlightT > 0) {
        var ht = p.highlightT;
        drawLabel(HIGHLIGHT_COLOR, p.opacity * ht * 0.6, 20 * ht);
        drawLabel(lerpColor(p.color, HIGHLIGHT_COLOR, ht), p.opacity, 0);
      } else {
        drawLabel(p.color, p.opacity, 0);
      }
    }

    ctx.globalAlpha = 1;

    // Cleanup fully faded particles
    for (var i = 0; i < toRemove.length; i++) {
      delete particleMap[toRemove[i]];
    }
    if (toRemove.length) {
      particles = [];
      for (var key in particleMap) particles.push(particleMap[key]);
    }

    raf = requestAnimationFrame(animate);
  }

  fetchAndDraw();
  setInterval(fetchAndDraw, REFRESH_INTERVAL);

  var socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', function () {
    statusEl.textContent = 'live';
    wsLog('connected');
  });
  socket.on('tags_updated', function (data) {
    wsLog('tags_updated' + (data ? ' ' + JSON.stringify(data) : ''));
    fetchAndDraw();
  });
  socket.on('step', function (data) {
    wsLog('step ' + (data && data.url ? data.url : JSON.stringify(data)));
  });
  socket.on('screenshot', function (data) {
    wsLog('screenshot ' + (data && data.screenshot_url ? data.screenshot_url : JSON.stringify(data)));
  });
  socket.on('location', function (data) {
    wsLog('location ' + JSON.stringify(data));
  });
  socket.on('analyzed', function (data) {
    if (data && data.tags) {
      highlightTags(data.tags);
      fetchAndDraw();
    }
    wsLog('analyzed ' + JSON.stringify(data));
  });
  socket.on('disconnect', function () {
    statusEl.textContent = 'disconnected';
    wsLog('disconnected');
  });
})();
</script>

</body>
</html>
