# ===================== storage-service =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: backfill-shared
        hostPath:
          path: /tmp/backfill
          type: DirectoryOrCreate
      containers:
      - name: storage-service
        image: storage-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 7781
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "7781"]
        env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: DATABASE_URI
        - name: BACKFILL_IMAGE_PATH
          value: "/tmp/backfill/presence.png"
        volumeMounts:
        - name: backfill-shared
          mountPath: /tmp/backfill
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        startupProbe:
          tcpSocket:
            port: 7781
          failureThreshold: 15
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 7781
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 7781
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: storage-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 7781
---
# ===================== steps-service =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steps-service
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steps-service
  template:
    metadata:
      labels:
        app: steps-service
    spec:
      containers:
      - name: steps-service
        image: steps-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8007
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8007"]
        env:
        - name: STEPS_IMAGE_URL
          value: "http://storage-service/export/img"
        - name: STEPS_LATEST_URL
          value: "http://app-service/api/storage_latest/"
        - name: STEPS_LATEST_LIMIT
          value: "3000"
        - name: STEPS_CSV_URL
          value: "http://storage-service/export/csv"
        - name: STEPS_REFRESH_SECONDS
          value: "60"
        - name: STEPS_OUTPUT_DIR
          value: "/app/data"
        resources:
          requests:
            cpu: "150m"
            memory: "512Mi"
          limits:
            cpu: "750m"
            memory: "2048Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8007
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /live
            port: 8007
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: steps-data
          mountPath: /app/data
      volumes:
      - name: steps-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: steps-service
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: steps-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8007
---
# ===================== tags-service =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tags-service
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tags-service
  template:
    metadata:
      labels:
        app: tags-service
    spec:
      containers:
      - name: tags-service
        image: tags-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: DATABASE_URI
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: SHHH_SENTRY_URL
        - name: TAGS_UI_REDIRECT_ORIGIN
          value: "https://jamming-bot.arthew0.online"
        resources:
          requests:
            cpu: "125m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tags-service
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: tags-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
# ===================== tags-db PVC =====================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tags-db-pvc
  namespace: jamming-bot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ===================== tags-db (PostgreSQL) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tags-db
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tags-db
  template:
    metadata:
      labels:
        app: tags-db
    spec:
      containers:
      - name: tags-db
        image: postgres:12-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "tags_db_dev"
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 20
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
      volumes:
      - name: pg-data
        persistentVolumeClaim:
          claimName: tags-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tags-db
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: tags-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
