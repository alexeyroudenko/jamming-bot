    - storage.jamming-bot.arthew0.online
    - data.jamming-bot.arthew0.online
    - keywords.jamming-bot.arthew0.online
    secretName: jamming-bot-svc-subdomains-tls
  rules:
  - host: tags.jamming-bot.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tags-service
            port:
              number: 80
  - host: semantic.jamming-bot.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: semantic-service
            port:
              number: 80
  - host: storage.jamming-bot.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storage-service
            port:
              number: 80
  - host: data.jamming-bot.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: data-service
            port:
              number: 80
  - host: keywords.jamming-bot.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keywords-service
            port:
              number: 80
---
# ===================== KEDA: worker-service autoscaler =====================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-service-scaler
  namespace: jamming-bot
spec:
  scaleTargetRef:
    name: worker-service
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
  - type: redis
    metadata:
      address: redis.jamming-bot.svc.cluster.local:6379
      listName: rq:queue:default
      listLength: "4"
      databaseIndex: "0"
---
# ===================== KEDA: html-renderer autoscaler =====================
# Screenshot jobs (do_screenshot) call html-renderer; scale up earlier under queue load.
# Caps tuned for single-node (~8 CPU): fewer Chromium replicas = less RAM/CPU thrash.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: html-renderer-scaler
  namespace: jamming-bot
spec:
  scaleTargetRef:
    name: html-renderer
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 90
  pollingInterval: 10
  triggers:
  - type: redis
    metadata:
      address: redis.jamming-bot.svc.cluster.local:6379
      listName: rq:queue:default
      listLength: "4"
      databaseIndex: "0"
---
# ===================== rq-exporter (Prometheus metrics) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rq-exporter
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rq-exporter
  template:
    metadata:
      labels:
        app: rq-exporter
    spec:
      enableServiceLinks: false
      containers:
      - name: rq-exporter
        image: mdawar/rq-exporter:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9726
          name: metrics
        env:
        - name: RQ_REDIS_HOST
          value: "redis"
        - name: RQ_REDIS_PORT
          value: "6379"
        - name: RQ_REDIS_DB
          value: "0"
        - name: PORT
          value: "9726"
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 9726
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 9726
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rq-exporter
  namespace: jamming-bot
  labels:
    app: rq-exporter
spec:
  type: ClusterIP
  selector:
    app: rq-exporter
  ports:
  - name: metrics
    protocol: TCP
    port: 9726
    targetPort: 9726
---
# LoadBalancer to expose rq-exporter metrics on :9101
apiVersion: v1
kind: Service
metadata:
  name: rq-exporter-lb
  namespace: jamming-bot
spec:
  type: LoadBalancer
  selector:
    app: rq-exporter
  ports:
  - name: metrics
    port: 9101
    targetPort: 9726
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rq-exporter
  namespace: jamming-bot
  labels:
    app: rq-exporter
spec:
  selector:
    matchLabels:
      app: rq-exporter
  endpoints:
  - port: metrics
    interval: 15s
    path: /
---
# ===================== n8n =====================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data-pvc
  namespace: jamming-bot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5678
        env:
        - name: N8N_HOST
          value: "n8n.arthew0.online"
        - name: N8N_PROTOCOL
          value: "https"
        - name: N8N_PORT
          value: "5678"
        - name: WEBHOOK_URL
          value: "https://n8n.arthew0.online/"
        - name: GENERIC_TIMEZONE
          value: "Europe/Moscow"
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 40
          periodSeconds: 20
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5678
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-redirect
  namespace: jamming-bot
spec:
  redirectRegex:
    regex: ^https?://n8n\.jamming-bot\.arthew0\.online/(.*)
    replacement: https://n8n.arthew0.online/$1
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-root-to-login
  namespace: jamming-bot
spec:
  redirectRegex:
    regex: ^https?://n8n\.arthew0\.online/$
    replacement: https://n8n.arthew0.online/login
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: jamming-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: jamming-bot-n8n-root-to-login@kubernetescrd
spec:
  tls:
  - hosts:
    - n8n.arthew0.online
    secretName: n8n-tls
  rules:
  - host: n8n.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-legacy-redirect-ingress
  namespace: jamming-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: jamming-bot-n8n-redirect@kubernetescrd
spec:
  tls:
  - hosts:
    - n8n.jamming-bot.arthew0.online
    secretName: n8n-legacy-tls
  rules:
  - host: n8n.jamming-bot.arthew0.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n
            port:
              number: 80
---
# ===================== backfill-worker (one-shot Job) =====================
# Run: make k3s-backfill-worker
# Monitor: kubectl logs -n jamming-bot job/backfill-worker -f
# Re-run: kubectl delete job backfill-worker -n jamming-bot && make k3s-backfill-worker
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-worker
  namespace: jamming-bot
spec:
  # Many pod restarts on crash/OOM before Job is marked Failed (was 3 → backoff limit too soon).
  backoffLimit: 100
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app: backfill-worker
    spec:
      volumes:
      - name: backfill-shared
        hostPath:
          path: /tmp/backfill
          type: DirectoryOrCreate
      containers:
      - name: backfill-worker
        image: backfill-worker:latest
        imagePullPolicy: Never
        env:
        - name: DATA_SERVICE_URL
          value: "http://data-service"
        - name: STORAGE_SERVICE_URL
          value: "http://storage-service"
        - name: APP_SERVICE_URL
          value: "http://app-service"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: BATCH_SIZE
          value: "10"
        - name: SLEEP_BETWEEN
          value: "2.0"
        - name: BACKFILL_STEP_BASE
          value: "0"
        - name: BACKFILL_MIN_ID
          value: "150000"
        - name: BACKFILL_MAX_ID
          value: "300000"
        - name: PRESENCE_PNG_PATH
          value: "/tmp/backfill/presence.png"
        - name: FETCH_CONCURRENCY
          value: "10"
        # Defaults; live tuning via Redis keys backfill_sleep / backfill_timeout from /ctrl/
        - name: PAGE_TIMEOUT
          value: "10"
        # Avoid OOM on huge pages (BeautifulSoup + duplicate strings); tune if needed.
        - name: MAX_HTML_BYTES
          value: "6291456"
        volumeMounts:
        - name: backfill-shared
          mountPath: /tmp/backfill
        resources:
          requests:
            cpu: "150m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "4Gi"
      restartPolicy: OnFailure
