    spec:
      containers:
      - name: bot-service
        image: bot-service:latest
        imagePullPolicy: Never
        env:
        - name: SHHH_API_KEY
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: SHHH_API_KEY
        - name: SHHH_MY_CHAT_ID
          value: "218014682"
        - name: SHHH_SENTRY_URL
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: SHHH_SENTRY_URL
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: FLASK_HOST
          value: "app-service"
        - name: FLASK_PORT
          value: "80"
        - name: OTEL_TRACING_ENABLED
          value: "1"
        - name: OTEL_SERVICE_NAME
          value: "bot-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4318"
        volumeMounts:
        - name: bot-db
          mountPath: /app/data
        - name: bot-config
          mountPath: /app/bot.yaml
        resources:
          requests:
            cpu: "250m"
            memory: "160Mi"
          limits:
            cpu: "500m"
            memory: "320Mi"
        livenessProbe:
          exec:
            command: ["python", "-c", "import os; os.path.exists('data/database.db')"]
