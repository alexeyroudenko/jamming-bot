# ===================== jaeger (tracing) =====================
# UI: http://jamming-bot.arthew0.online:31686 or https://jaeger.jamming-bot.arthew0.online
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.52
        imagePullPolicy: IfNotPresent
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4318
          name: otlp-http
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
  - name: ui
    protocol: TCP
    port: 80
    targetPort: 16686
  - name: otlp-http
    protocol: TCP
    port: 4318
    targetPort: 4318
---
# Jaeger UI: https://jaeger.jamming-bot.arthew0.online or http://jamming-bot.arthew0.online:31686
# To use :16686 set k3s --service-node-port-range=16686-32767 and change nodePort to 16686
apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeport
  namespace: jamming-bot
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
  - name: ui
    protocol: TCP
    port: 80
    targetPort: 16686
    nodePort: 31686
---
# ===================== otel-collector (OTLP fan-out: Jaeger + Coroot) =====================
# Apps use OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 (HTTP OTLP).
# Coroot: gRPC OTLP on coroot-coroot.coroot:4317 + header x-api-key from Secret COROOT_OTEL_API_KEY.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: jamming-bot
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      otlphttp/jaeger:
        endpoint: http://jaeger:4318
        tls:
          insecure: true
      otlp/coroot:
        endpoint: coroot-coroot.coroot.svc.cluster.local:4317
        tls:
          insecure: true
        # Coroot gRPC без gzip-распаковки в ответе; иначе: Decompressor is not installed for grpc-encoding "gzip"
        compression: none
        # Пустой default, если ключа нет в Secret — под стартует; верни ключ в jamming-bot-secrets для Coroot.
        headers:
          x-api-key: ${env:COROOT_OTEL_API_KEY:-}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/jaeger, otlp/coroot]
      telemetry:
        logs:
          level: warn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.115.1
        imagePullPolicy: IfNotPresent
        args:
        - --config=/etc/otelcol/config.yaml
        env:
        - name: COROOT_OTEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: COROOT_OTEL_API_KEY
              optional: true
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 13133
          name: health
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: jamming-bot
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    protocol: TCP
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    protocol: TCP
    port: 4318
    targetPort: otlp-http
  - name: health
    protocol: TCP
    port: 13133
    targetPort: health
---
# ===================== worker-service (rq workers) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      containers:
      - name: worker
        image: app-service:latest
        imagePullPolicy: Never
        command: ["python", "worker.py"]
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: TAGS_SERVICE_URL
          value: "http://tags-service"
        - name: SEMANTIC_SERVICE_URL
          value: "http://semantic-service"
        - name: MOOD_SERVICE_URL
          value: "http://mood-service"
        - name: STORAGE_SERVICE_URL
          value: "http://storage-service"
        - name: DATA_SERVICE_URL
          value: "http://data-service"
        - name: IP_SERVICE_URL
          value: "http://ip-service"
        - name: RENDERER_SERVICE_URL
          value: "http://html-renderer-service"
        - name: IMAGE_ANALYZE_SERVICE_URL
          value: "http://image-analyze-service"
        - name: S3_HOST
          value: "s3.firstvds.ru"
        - name: S3_PORT
          value: "443"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: S3_SECRET_KEY
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: jamming-bot-secrets
              key: SHHH_SENTRY_URL
        - name: S3_BUCKET_NAME
          value: "steps"
        - name: OTEL_TRACING_ENABLED
          value: "1"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4318"
        - name: OTEL_SERVICE_NAME
          value: "app-service-worker"
        resources:
          requests:
            cpu: "125m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
---
# ===================== rq-dashboard =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rq-dashboard
  namespace: jamming-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rq-dashboard
  template:
    metadata:
      labels:
        app: rq-dashboard
    spec:
      containers:
      - name: rq-dashboard
        image: kudaw/rq-dashboard
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9181
        env:
        - name: RQ_DASHBOARD_REDIS_URL
          value: "redis://redis:6379/0"
        - name: RQ_DASHBOARD_PORT
