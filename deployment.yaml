# ===================== Ingress =====================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: html-renderer-ingress
  namespace: jamming-bot
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: jamming-bot-strip-keywords@kubernetescrd,jamming-bot-strip-storage@kubernetescrd,jamming-bot-strip-steps@kubernetescrd,jamming-bot-strip-tags@kubernetescrd,jamming-bot-strip-ip@kubernetescrd,jamming-bot-strip-data@kubernetescrd,jamming-bot-strip-app@kubernetescrd
spec:
  rules:
    - http:
        paths:
        # Only /tags/api/* goes to tags-service (strip /tags -> /api/v1/...). UI routes /tags/, /tags/3d/, etc. stay on app-service.
        - path: /tags/api
          pathType: Prefix
          backend:
            service:
              name: tags-service
              port:
                number: 80
        - path: /render
          pathType: Prefix
          backend:
            service:
              name: html-renderer-service
              port:
                number: 80
        - path: /keywords
          pathType: Prefix
          backend:
            service:
              name: keywords-service
              port:
                number: 80
        # /semantic/ and /semantic/* are Flask (app-service); API is internal or https://semantic.jamming-bot.arthew0.online/
        - path: /storage
          pathType: Prefix
          backend:
            service:
              name: storage-service
              port:
                number: 80
        - path: /steps
          pathType: Prefix
          backend:
            service:
              name: steps-service
              port:
                number: 80
        - path: /ip
          pathType: Prefix
          backend:
            service:
              name: ip-service
              port:
                number: 80
        - path: /data
          pathType: Prefix
          backend:
            service:
              name: data-service
              port:
                number: 80
        - path: /app
          pathType: Prefix
          backend:
            service:
              name: app-service
              port:
                number: 80
---
# Tags REST API on main host: strip /tags so backend receives /api/v1/tags/...
# (UI pages /tags/, /tags/3d/ are served by app-service via app-subdomain-ingress / without strip-tags.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jamming-bot-tags-api-ingress
  namespace: jamming-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: jamming-bot-strip-tags@kubernetescrd
spec:
  tls:
  - hosts:
    - jamming-bot.arthew0.online
    secretName: jamming-bot-tls
  rules:
  - host: jamming-bot.arthew0.online
    http:
      paths:
      # OpenAPI/Swagger at service root (/docs, /openapi.json) after strip /tags
      - path: /tags/docs
        pathType: Prefix
        backend:
          service:
            name: tags-service
            port:
              number: 80
      - path: /tags/openapi.json
        pathType: Prefix
        backend:
          service:
            name: tags-service
            port:
              number: 80
      - path: /tags/api
        pathType: Prefix
        backend:
          service:
            name: tags-service
            port:
              number: 80
---
# ===================== cert-manager ClusterIssuer =====================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alexey.roudenko@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: traefik
---
# ===================== app subdomain Ingress =====================
# Hosts: app.jamming-bot, jamming-bot, b0ts — all serve app-service at root path
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-subdomain-ingress
  namespace: jamming-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # strip-tags is not applied here: /tags/* UI paths must reach app-service with full path. Tags REST API uses jamming-bot-tags-api-ingress (strip /tags only for /tags/api/*).
    # strip-semantic is not applied: /semantic/* UI is Flask on app-service; do not route /semantic to semantic-service (FastAPI has no / page — only /api/v1/semantic/...).
    traefik.ingress.kubernetes.io/router.middlewares: jamming-bot-strip-keywords@kubernetescrd,jamming-bot-strip-storage@kubernetescrd,jamming-bot-strip-steps@kubernetescrd,jamming-bot-strip-ip@kubernetescrd,jamming-bot-strip-data@kubernetescrd,jamming-bot-strip-app@kubernetescrd
spec:
  tls:
  - hosts:
    - jamming-bot.arthew0.online
    - app.jamming-bot.arthew0.online
    - b0ts.arthew0.online
    - rq.jamming-bot.arthew0.online
    - jaeger.jamming-bot.arthew0.online
    secretName: jamming-bot-tls
  rules:
    - host: jaeger.jamming-bot.arthew0.online
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: jaeger
              port:
                number: 80
    - host: rq.jamming-bot.arthew0.online
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: rq-dashboard
              port:
                number: 80
    - host: app.jamming-bot.arthew0.online
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: app-service
              port:
                number: 80
    - host: jamming-bot.arthew0.online
      http:
        paths:
        - path: /data
          pathType: Prefix
          backend:
            service:
              name: data-service
              port:
                number: 80
        - path: /storage
          pathType: Prefix
          backend:
            service:
              name: storage-service
              port:
                number: 80
        - path: /steps
          pathType: Prefix
          backend:
            service:
              name: steps-service
              port:
                number: 80
        - path: /keywords
          pathType: Prefix
          backend:
            service:
              name: keywords-service
              port:
                number: 80
        - path: /ip
          pathType: Prefix
          backend:
            service:
              name: ip-service
              port:
                number: 80
        - path: /render
          pathType: Prefix
          backend:
            service:
              name: html-renderer-service
              port:
                number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: app-service
              port:
                number: 80
    - host: b0ts.arthew0.online
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: app-service
              port:
                number: 80
---
# ===================== Microservice subdomains (no strip-prefix middleware) =====================
# One host per service; paths reach backends as-is (/api/v1/..., /health, ...).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jamming-bot-svc-subdomains-ingress
  namespace: jamming-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - tags.jamming-bot.arthew0.online
